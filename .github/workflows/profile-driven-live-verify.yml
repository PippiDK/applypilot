name: Profile-driven LIVE verification

on:
  push:
    branches:
      - feature/cv-library-3-slots
      - fix/search-stability-step5-master-pool

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: node --test --test-name-pattern="previous in-window candidate remains|master pool drops a previous candidate|master pool cache is isolated|master pool cache safely returns empty|all freshness views use the same 14-day|1/3/7/14-day views are local subsets|same verified job and Search Profile|default discovery search plan" app/lib/linkedin-profile-search.test.mjs app/lib/linkedin-master-pool-cache.test.mjs app/lib/search-query-expansion-ai.test.mjs
      - name: Build
        run: npm run build
