name: Profile-driven LIVE verification

on:
  push:
    branches:
      - feature/cv-library-3-slots
      - fix/search-stability-step3-stable-query-plan

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: node --test --test-name-pattern="deterministic discovery expansion|default discovery search plan|role evaluation uses the full approved|same verified job" app/lib/search-query-expansion-ai.test.mjs app/lib/linkedin-profile-search.test.mjs
      - name: Build
        run: npm run build
