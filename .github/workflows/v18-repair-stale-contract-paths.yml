name: V18 repair stale contract paths

on:
  push:
    branches:
      - 'v18/repair-stale-contract-paths'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/night-flight-right-panel-source-job-id
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Detect stale contract files from current failures
        shell: bash
        run: |
          set +e
          npm test > /tmp/before.log 2>&1
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          log=Path('/tmp/before.log').read_text(errors='replace').splitlines()
          files=[]
          for line in log:
              m=re.search(r"location: '.*?/app/lib/([^']+?):\d+:\d+'",line)
              if m and m.group(1) not in files:
                  files.append(m.group(1))

          # Handle both sync and async filesystem reads of page.js.
          direct=re.compile(
              r"(?P<fn>(?:fs\.)?readFile(?:Sync)?)\(\s*new URL\(\s*(['\"])\.\./page\.js\2\s*,\s*import\.meta\.url\s*\)\s*,\s*(['\"])utf8\3\s*\)"
          )
          path_decl=re.compile(
              r"const\s+(\w+)\s*=\s*new URL\(\s*(['\"])\.\./page\.js\2\s*,\s*import\.meta\.url\s*\)"
          )

          changed=[]
          for name in files:
              path=Path('app/lib')/name
              if not path.exists():
                  continue
              text=path.read_text()
              if "../page.js" not in text:
                  continue
              original=text

              # Dynamic sourceText helper used by the V18 regression guard.
              old_helper="const sourceText=relative=>readFile(new URL(relative,import.meta.url),'utf8')"
              if old_helper in text:
                  new_helper="const sourceText=async relative=>{const source=await readFile(new URL(relative,import.meta.url),'utf8');if(relative!=='../page.js')return source;const main=await readFile(new URL('../main-search-base.js',import.meta.url),'utf8');return source+'\\n'+main}"
                  text=text.replace(old_helper,new_helper)

              def repl_direct(m):
                  fn=m.group('fn')
                  old=m.group(0)
                  main=f"{fn}(new URL('../main-search-base.js',import.meta.url),'utf8')"
                  # async readFile expressions must be awaited individually; callers already await the whole expression.
                  if fn.endswith('readFile'):
                      return f"Promise.all([{old},{main}]).then(parts=>parts.join('\\n'))"
                  return f"({old}+'\\n'+{main})"
              text=direct.sub(repl_direct,text)

              page_vars=[m.group(1) for m in path_decl.finditer(text)]
              for var in page_vars:
                  named=re.compile(
                      rf"(?P<fn>(?:fs\.)?readFile(?:Sync)?)\(\s*{re.escape(var)}\s*,\s*(['\"])utf8\2\s*\)"
                  )
                  def repl_named(m):
                      fn=m.group('fn')
                      old=m.group(0)
                      main=f"{fn}(new URL('../main-search-base.js',import.meta.url),'utf8')"
                      if fn.endswith('readFile'):
                          return f"Promise.all([{old},{main}]).then(parts=>parts.join('\\n'))"
                      return f"({old}+'\\n'+{main})"
                  text=named.sub(repl_named,text)

              if text!=original:
                  path.write_text(text)
                  changed.append(str(path))

          print('Changed stale contract files:')
          for item in changed:
              print(item)
          if not changed:
              raise SystemExit('No stale page.js contract references were updated')
          PY
      - name: Verify full test suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/after.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo 'Remaining failing tests:'
            grep -A 12 '^not ok ' /tmp/after.log || true
            exit "$code"
          fi
          tail -n 20 /tmp/after.log
      - name: Verify build
        run: npm run build
      - name: Commit repaired contracts to PR branch
        run: |
          git config user.name "PippiDK"
          git config user.email "133820767+PippiDK@users.noreply.github.com"
          git add app/lib
          git commit -m "test: follow extracted Main Search source in UI contracts"
          git push origin HEAD:fix/night-flight-right-panel-source-job-id
