name: UI Milestone Patch

on:
  push:
    branches:
      - feature/cv-library-3-slots

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'wire manual job statuses and header facts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cv-library-3-slots
      - name: Apply bounded UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/page.js')
          text=path.read_text()

          def one(old,new,label):
            global text
            count=text.count(old)
            if count!=1:
              raise SystemExit(f'{label}: expected exactly one target, found {count}')
            text=text.replace(old,new,1)

          one("import {compareShadowToLegacy} from './lib/shadow-search-compare.js'\n","import {compareShadowToLegacy} from './lib/shadow-search-compare.js'\nimport {JOB_STATUS_OPTIONS,readJobStatuses,writeJobStatus} from './lib/job-statuses.js'\n",'status import')
          one("  const [selected,setSelected]=useState(null)\n  const [state,setState]=useState({loading:false,error:'',coverage:null,stats:null,fetchedAt:null,audit:[]})\n","  const [selected,setSelected]=useState(null)\n  const [jobStatuses,setJobStatuses]=useState({})\n  const [state,setState]=useState({loading:false,error:'',coverage:null,stats:null,fetchedAt:null,audit:[]})\n",'status state')
          one("  },[])\n\n  const profileReady=Boolean(profile.savedAt)\n","  },[])\n\n  useEffect(()=>{\n    setJobStatuses(readJobStatuses(localStorage))\n  },[])\n\n  const profileReady=Boolean(profile.savedAt)\n",'status hydration')
          one("  async function search(){\n","  function changeJobStatus(jobId,status){\n    setJobStatuses(current=>writeJobStatus({storage:localStorage,statuses:current,jobId,status}))\n  }\n\n  async function search(){\n",'status handler')

          old_list=("        {jobs.map(item=>{const {job,evaluation}=item; const score=Math.round(evaluation.score*10); return <button key={job.sourceJobId} onClick={()=>setSelected(item)} className={'job '+(active?.job.sourceJobId===job.sourceJobId?'active':'')}>\n"+"          <span className=\"score\">{fitLabel(score)}</span>\n"+"          <span><b>{job.title}</b><small>{job.company} · {job.location}</small><small className=\"sourceLine\">LinkedIn · {dateText(job.publishedAt)}</small></span>\n"+"          <span>→</span>\n"+"        </button>})}\n")
          new_list=("        {jobs.map(item=>{const {job,evaluation}=item; const score=Math.round(evaluation.score*10); const manualStatus=jobStatuses[job.sourceJobId]||''; return <div className=\"jobWrap\" key={job.sourceJobId}>\n"+"          <button onClick={()=>setSelected(item)} className={'job '+(active?.job.sourceJobId===job.sourceJobId?'active':'')}>\n"+"            <span className=\"score\">{fitLabel(score)}</span>\n"+"            <span><b>{job.title}</b><small>{job.company} · {job.location}</small><small className=\"sourceLine\">LinkedIn · {dateText(job.publishedAt)}</small></span>\n"+"            <span>→</span>\n"+"          </button>\n"+"          <select aria-label={`Status for ${job.title}`} className={`jobStatusSelect status-${manualStatus||'none'}`} value={manualStatus} onChange={event=>changeJobStatus(job.sourceJobId,event.target.value)}>\n"+"            {JOB_STATUS_OPTIONS.map(option=><option key={option.value||'none'} value={option.value}>{option.label}</option>)}\n"+"          </select>\n"+"        </div>})}\n")
          one(old_list,new_list,'Live matches statuses')

          condition=("          <div className=\"conditionGrid\">\n"+"            <div className=\"conditionCard\"><small>Area</small><b>{conditionScore(jobConditions?.area.score)}</b><span>{jobConditions?.area.value||'Not stated'}</span></div>\n"+"            <div className=\"conditionCard\"><small>Salary</small><b>{conditionScore(jobConditions?.salary.score)}</b><span>{jobConditions?.salary.value||'Not stated'}</span></div>\n"+"            <div className=\"conditionCard\"><small>Employment type</small><b>{conditionScore(jobConditions?.employmentType.score)}</b><span>{jobConditions?.employmentType.value||'Not stated'}</span></div>\n"+"            <div className=\"conditionCard\"><small>Work model</small><b>{conditionScore(jobConditions?.workModel.score)}</b><span>{jobConditions?.workModel.value||'Not stated'}</span></div>\n"+"          </div>\n")
          if text.count(condition)!=1:
            raise SystemExit(f'condition grid: expected exactly one target, found {text.count(condition)}')
          text=text.replace(condition,'',1)

          header=("          <div className=\"panelTop expertiseHeader\"><div><h2>{job.title}</h2><p>{job.company} · {job.location}</p><small className=\"sourceLine\">Source: LinkedIn · {dateText(job.publishedAt)}</small></div></div>\n\n"+"          <BestCvPanel job={job} cvLibrary={cvLibrary}/>\n")
          header_with_facts=("          <div className=\"panelTop expertiseHeader\"><div><h2>{job.title}</h2><p>{job.company} · {job.location}</p><small className=\"sourceLine\">Source: LinkedIn · {dateText(job.publishedAt)}</small></div></div>\n\n"+condition+"\n          <BestCvPanel job={job} cvLibrary={cvLibrary}/>\n")
          one(header,header_with_facts,'header facts')
          path.write_text(text)

          css_path=Path('app/globals.css')
          css=css_path.read_text()
          marker='/* Manual vacancy status — informational only; never filters or scores jobs */'
          if marker in css:
            raise SystemExit('manual status CSS already present')
          css += "\n\n/* Manual vacancy status — informational only; never filters or scores jobs */\n.jobWrap{position:relative;margin:10px 0}\n.jobWrap .job{margin:0;padding-bottom:48px}\n.jobStatusSelect{position:absolute;left:90px;bottom:12px;z-index:2;max-width:170px;border-radius:999px;padding:5px 24px 5px 9px;background:#12171c;border:1px solid #343d48;color:#8994a1;font-size:9px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;outline:none}\n.jobStatusSelect.status-none{border-color:#343d48;color:#8994a1;background:#12171c}\n.jobStatusSelect.status-applied{border-color:#285e4a;color:#7ee2b8;background:#132019}\n.jobStatusSelect.status-considering{border-color:#65552d;color:#e7c56a;background:#211d12}\n.jobStatusSelect.status-ignore{border-color:#743d41;color:#ef9da2;background:#281819}\n@media(max-width:780px){.jobStatusSelect{left:90px}}\n"
          css_path.write_text(css)
          PY
      - name: Commit bounded UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/globals.css
          git diff --cached --check
          git commit -m "feat: wire manual job statuses and header facts"
          git push origin HEAD:feature/cv-library-3-slots
