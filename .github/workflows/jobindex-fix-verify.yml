name: Jobindex fix verification

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted Jobindex tests
        run: node --test app/lib/jobindex-parser.test.mjs app/lib/jobindex-source-adapter.test.mjs app/lib/search-source-orchestrator.test.mjs

  ats-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture public ATS responses
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const targets={
            emply:'https://dao.career.emply.com/da/ad/carrier-for-night-distribution-at-dao/ihba5r',
            successfactors:'https://job.wfs.aero/job/Trafik-Agent/1708-en_US/',
          }
          const meta={}
          for(const [name,url] of Object.entries(targets)){
            const r=await fetch(url)
            const text=await r.text()
            fs.writeFileSync(`${name}.html`,text)
            meta[name]={status:r.status,finalUrl:r.url,contentType:r.headers.get('content-type'),length:text.length}
          }
          const oracle=[]
          for(const siteNumber of ['CX_1','CX_2001']){
            const u=new URL('https://efzu.fa.em2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitionDetails')
            u.searchParams.set('expand','all')
            u.searchParams.set('onlyData','true')
            u.searchParams.set('finder',`ById;Id="8022",siteNumber=${siteNumber}`)
            const r=await fetch(u,{headers:{Accept:'application/json','Ora-Irc-Language':'da'}})
            const text=await r.text()
            fs.writeFileSync(`oracle-${siteNumber}.txt`,text)
            oracle.push({siteNumber,status:r.status,finalUrl:r.url,contentType:r.headers.get('content-type'),length:text.length,preview:text.slice(0,500)})
          }
          fs.writeFileSync('meta.json',JSON.stringify({...meta,oracle},null,2))
          console.log(JSON.stringify({...meta,oracle},null,2))
          NODE
      - name: Upload ATS fixtures
        uses: actions/upload-artifact@v4
        with:
          name: jobindex-ats-probe
          path: |
            meta.json
            emply.html
            successfactors.html
            oracle-CX_1.txt
            oracle-CX_2001.txt
          retention-days: 1
