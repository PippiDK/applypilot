name: Jobindex remaining probe

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace DSV and DSB resolvers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import {
            DSB_CURRENT_JOBS_URL,
            dsbAppliedUrlForTitle,
            dsvSearchUrl,
            exactTitleJobHref,
          } from './app/lib/jobindex-retrieval-fallbacks.js'
          import {extractJobindexExternalDetail} from './app/lib/jobindex-parser.js'

          const report={dsv:{},dsb:{}}
          const dsvTitle='Senior Project Manager – join our Group Property Transaction team'
          const dsvUrl=dsvSearchUrl(dsvTitle)
          const dsvResponse=await fetch(dsvUrl)
          const dsvHtml=await dsvResponse.text()
          const dsvAnchors=[...dsvHtml.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)]
            .map(m=>({href:m[1],label:String(m[2]||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}))
            .filter(a=>/Senior Project Manager/i.test(a.label))
          const dsvDirect=exactTitleJobHref(dsvHtml,dsvTitle,'https://jobs.dsv.com/')
          report.dsv={searchUrl:dsvUrl,status:dsvResponse.status,matchingAnchors:dsvAnchors,resolvedUrl:dsvDirect}
          if(dsvDirect){
            const directResponse=await fetch(dsvDirect)
            const directHtml=await directResponse.text()
            const parsed=extractJobindexExternalDetail(directHtml,{url:directResponse.url||dsvDirect})
            report.dsv.direct={status:directResponse.status,finalUrl:directResponse.url,fullJdLength:String(parsed.fullJd||'').length}
          }

          const dsbTitle='IT Service Delivery Manager med ansvar for leverandørstyring og stabile IT-services'
          const dsbResponse=await fetch(DSB_CURRENT_JOBS_URL)
          const dsbHtml=await dsbResponse.text()
          const titleIndex=dsbHtml.indexOf(dsbTitle)
          const dsbDirect=dsbAppliedUrlForTitle(dsbHtml,dsbTitle)
          report.dsb={status:dsbResponse.status,titleIndex,resolvedUrl:dsbDirect,snippet:titleIndex>=0?dsbHtml.slice(Math.max(0,titleIndex-400),titleIndex+1800):''}
          if(dsbDirect){
            const directResponse=await fetch(dsbDirect)
            const directHtml=await directResponse.text()
            const parsed=extractJobindexExternalDetail(directHtml,{url:directResponse.url||dsbDirect})
            report.dsb.direct={status:directResponse.status,finalUrl:directResponse.url,fullJdLength:String(parsed.fullJd||'').length}
          }

          fs.writeFileSync('resolver-report.json',JSON.stringify(report,null,2))
          console.log(JSON.stringify(report,null,2))
          NODE
      - name: Upload resolver report
        uses: actions/upload-artifact@v4
        with:
          name: jobindex-resolver-probe
          path: resolver-report.json
          retention-days: 1
