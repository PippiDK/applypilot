name: Jobindex remaining probe

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify final retrieval paths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const targets={
            deifAd:'https://candidate.hr-manager.net/ApplicationInit.aspx?cid=2273&ProjectId=143916&DepartmentId=18963&MediaId=4616',
            vikingFrame:'https://viking-life.hr-on.com/frame-api/pages/show-job/40110?companyid=192&locale=da_DK',
            steelCanonical:'https://www.jobindex.dk/jobannonce/h1690926/technical-project-manager-bliv-en-del-af-et-staerkt-og-udviklende-team',
          }
          const report={}
          for(const [name,url] of Object.entries(targets)){
            try{
              const r=await fetch(url,{redirect:'follow'})
              const text=await r.text()
              fs.writeFileSync(`${name}.html`,text)
              report[name]={
                status:r.status,finalUrl:r.url,length:text.length,
                markers:{
                  description:/class=["'][^"']*description/i.test(text),
                  advertisement:/AdvertisementInnerContent|AdContentContainer/i.test(text),
                  target:/Project Manager for development projects|Project Manager for Service Excellence|Technical Project Manager/i.test(text),
                  jobposting:/JobPosting/i.test(text),
                  paidjob:/PaidJob-inner/i.test(text)
                }
              }
            }catch(error){report[name]={error:String(error)}}
          }
          fs.writeFileSync('final-path-report.json',JSON.stringify(report,null,2))
          console.log(JSON.stringify(report,null,2))
          NODE
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: jobindex-final-path-probe
          path: |
            final-path-report.json
            *.html
          retention-days: 1
