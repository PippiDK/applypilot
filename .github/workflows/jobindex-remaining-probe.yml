name: Jobindex remaining probe

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe remaining limited-data vacancies
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const jobs={
            deif:'h1693319',
            viking:'h1685703',
            steeltank:'h1690926',
            dsv:'h1692169',
            visue:'h1693574',
            dsb:'h1690238',
          }
          const report={jobindex:{},direct:{}}
          const decode=s=>String(s||'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
          for(const [name,id] of Object.entries(jobs)){
            const url=`https://www.jobindex.dk/vis-job/${id}`
            const r=await fetch(url)
            const html=await r.text()
            fs.writeFileSync(`${name}-jobindex.html`,html)
            const anchors=[...html.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)].map(m=>({href:decode(m[1]),label:String(m[2]||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()})).filter(x=>/^https?:\/\//i.test(x.href))
            const scripts=[...html.matchAll(/<script\b[^>]*src=["']([^"']+)["']/gi)].map(m=>decode(m[1]))
            report.jobindex[name]={status:r.status,length:html.length,anchors:anchors.slice(0,80),scripts:scripts.slice(0,40),hasReqNumber:/Job Req Number/i.test(html),reqNumbers:[...html.matchAll(/Job Req Number[^0-9]{0,40}(\d{4,8})/gi)].map(m=>m[1]).slice(0,5)}
          }

          const direct={
            vikingDirect:'https://viking-life.hr-on.com/show-job/40110?linkref=3919&locale=da_DK',
            vikingHrJs:'https://viking-life.hr-on.com/frame-api/hr.js',
            vikingCustomerJs:'https://viking-life.hr-on.com/frame-api/customers/viking-regular-v2.js',
            visueDirect:'https://hr-skyen.dk/hr/show-job/349477?locale=da_DK',
            visueHrJs:'https://hr-skyen.dk/hr/frame-api/hr.js',
            visueCustomerJs:'https://hr-skyen.dk/hr/frame-api/customers/lindberghr.js',
            dsbJobs:'https://www.dsb.dk/om-dsb/job-og-karriere/alle-ledige-stillinger-i-dsb/',
            dsvKnown:'https://jobs.dsv.com/job/Hedehusene-Senior-Project-Manager-join-our-Group-Property-Transaction-team-84-2640/1429452533/',
          }
          for(const [name,url] of Object.entries(direct)){
            try{
              const r=await fetch(url)
              const text=await r.text()
              fs.writeFileSync(`${name}.txt`,text)
              report.direct[name]={status:r.status,finalUrl:r.url,length:text.length,contentType:r.headers.get('content-type'),markers:{description:/class=["'][^"']*description/i.test(text),advertisement:/AdvertisementInnerContent|AdContentContainer/i.test(text),itemprop:/itemprop=["']description["']/i.test(text),jobposting:/JobPosting/i.test(text),serviceDelivery:/IT Service Delivery Manager/i.test(text)}}
              if(name==='dsbJobs'){
                const hit=text.match(/<a\b[^>]*href=["']([^"']+)["'][^>]*>[\s\S]{0,400}?IT Service Delivery Manager[\s\S]{0,400}?<\/a>/i)
                report.direct[name].matchedHref=hit?.[1]||''
              }
            }catch(error){report.direct[name]={error:String(error)}}
          }

          fs.writeFileSync('remaining-report.json',JSON.stringify(report,null,2))
          console.log(JSON.stringify(report,null,2))
          NODE
      - name: Upload remaining probe
        uses: actions/upload-artifact@v4
        with:
          name: jobindex-remaining-probe
          path: |
            remaining-report.json
            *.html
            *.txt
          retention-days: 1
