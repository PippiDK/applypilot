name: Jobindex remaining probe

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical full-JD pages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const targets={
            deif:'https://www.jobindex.dk/jobannonce/h1693319/project-manager-for-development-projects',
            steel:'https://www.jobindex.dk/jobannonce/h1690926/technical-project-manager-bliv-en-del-af-et-staerkt-og-udviklende-team',
            dsv:'https://www.jobindex.dk/jobannonce/h1692169/senior-project-manager-join-our-group-property-transaction-team',
            dsb:'https://www.jobindex.dk/jobannonce/h1690238/it-service-delivery-manager-med-ansvar-for-leverandoerstyring-og-stabile-it-services',
          }
          const report={}
          for(const [name,url] of Object.entries(targets)){
            const r=await fetch(url,{redirect:'follow'})
            const text=await r.text()
            fs.writeFileSync(`${name}.html`,text)
            const body=text.match(/<section\b[^>]*class=["'][^"']*jobtext-jobad__body[^"']*["'][^>]*>([\s\S]*?)<\/section>/i)?.[1]||''
            const plain=body.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()
            report[name]={status:r.status,finalUrl:r.url,length:text.length,hasBody:!!body,bodyLength:plain.length,title:(text.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i)?.[1]||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
          }
          fs.writeFileSync('canonical-report.json',JSON.stringify(report,null,2))
          console.log(JSON.stringify(report,null,2))
          for(const [name,item] of Object.entries(report)) if(!(item.status===200&&item.hasBody&&item.bodyLength>500)) throw new Error(`${name} canonical JD missing`)
          NODE
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: jobindex-canonical-probe
          path: |
            canonical-report.json
            *.html
          retention-days: 1
