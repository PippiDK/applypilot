name: Step 3 Exact Failure Debug

on:
  push:
    branches:
      - feature/cv-library-3-slots

jobs:
  exact-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2510d463fdf6270a7a2f831f6d5ccc26917e208a
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run each test separately and print only failures
        shell: bash
        run: |
          failed=0
          for test_file in app/lib/*.test.mjs; do
            if ! node --test "$test_file" > /tmp/one-test.log 2>&1; then
              echo "=== FAILING TEST FILE: $test_file ==="
              cat /tmp/one-test.log
              echo "=== END FAILURE: $test_file ==="
              failed=1
            fi
          done
          exit "$failed"
