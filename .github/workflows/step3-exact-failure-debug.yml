name: Step 3 Exact Failure Debug

on:
  push:
    branches:
      - feature/cv-library-3-slots

permissions:
  contents: write

jobs:
  exact-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2510d463fdf6270a7a2f831f6d5ccc26917e208a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture exact failing tests
        shell: bash
        run: |
          : > /tmp/step3-test-diagnostic.txt
          failed=0
          for test_file in app/lib/*.test.mjs; do
            if ! node --test "$test_file" > /tmp/one-test.log 2>&1; then
              {
                echo "=== FAILING TEST FILE: $test_file ==="
                cat /tmp/one-test.log
                echo "=== END FAILURE: $test_file ==="
                echo
              } >> /tmp/step3-test-diagnostic.txt
              failed=1
            fi
          done
          if [ "$failed" -eq 0 ]; then
            echo "ALL INDIVIDUAL TEST FILES PASSED" > /tmp/step3-test-diagnostic.txt
          fi
      - name: Persist diagnostic on feature branch
        shell: bash
        run: |
          git checkout -B feature/cv-library-3-slots origin/feature/cv-library-3-slots
          cp /tmp/step3-test-diagnostic.txt step3-test-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add step3-test-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: capture exact step 3 failing test"
            git push origin feature/cv-library-3-slots
          fi
