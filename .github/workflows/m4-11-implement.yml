name: M4.11 Apply Work Patch

on:
  push:
    branches:
      - work/m4-11-review-ui
    paths:
      - .github/workflows/m4-11-implement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update superseded M4.7 review contracts
        run: node scripts/m4-11-update-legacy-tests.mjs
      - name: Commit M4.11 contract update
        run: |
          git config user.name "applypilot-ci"
          git config user.email "applypilot-ci@users.noreply.github.com"
          git add app/lib/profile-review.test.mjs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: align legacy review contracts with M4.11"
          git push origin HEAD:work/m4-11-review-ui
