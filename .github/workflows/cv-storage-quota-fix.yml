name: CV Storage Quota Fix

on:
  push:
    branches:
      - fix/cv-storage-quota-test

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-storage-quota-test
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Apply minimal single-copy CV persistence fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/main-search-base.js')
          text = path.read_text()

          duplicate_write = 'localStorage.setItem(SOURCE_CV_STORAGE_KEY,JSON.stringify(primaryCv))'
          if text.count(duplicate_write) != 2:
              raise SystemExit(f'Expected 2 Source CV duplicate writes, found {text.count(duplicate_write)}')
          text = text.replace(duplicate_write, 'localStorage.removeItem(SOURCE_CV_STORAGE_KEY)')

          canonical_write = 'localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(nextLibrary))'
          if text.count(canonical_write) != 2:
              raise SystemExit(f'Expected 2 CV library writes, found {text.count(canonical_write)}')
          replacement_write = "localStorage.removeItem(SOURCE_CV_STORAGE_KEY)\n      localStorage.removeItem(LEGACY_CV_STORAGE_KEY)\n      " + canonical_write
          text = text.replace(canonical_write, replacement_write, 1)

          path.write_text(text)
          PY

      - name: Add regression contract
        run: |
          cat > app/lib/cv-storage-single-copy.contract.test.mjs <<'EOF'
          import test from 'node:test'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const source=fs.readFileSync(new URL('../main-search-base.js',import.meta.url),'utf8')

          test('CV library is the only persisted full CV copy',()=>{
            assert.equal(source.includes('localStorage.setItem(SOURCE_CV_STORAGE_KEY'),false)
          })

          test('old duplicate CV storage is cleared before replacement library write',()=>{
            const clearSource=source.indexOf('localStorage.removeItem(SOURCE_CV_STORAGE_KEY)',source.indexOf('async function parseCv'))
            const clearLegacy=source.indexOf('localStorage.removeItem(LEGACY_CV_STORAGE_KEY)',clearSource)
            const writeLibrary=source.indexOf('localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(nextLibrary))',clearLegacy)
            assert.ok(clearSource>=0)
            assert.ok(clearLegacy>clearSource)
            assert.ok(writeLibrary>clearLegacy)
          })

          test('hydration migrates canonical library before removing obsolete duplicate keys',()=>{
            const canonical=source.indexOf('if(readyCvCount(library)>0) localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(library))')
            const primary=source.indexOf('if(primaryCv){',canonical)
            const clearSource=source.indexOf('localStorage.removeItem(SOURCE_CV_STORAGE_KEY)',primary)
            const clearLegacy=source.indexOf('localStorage.removeItem(LEGACY_CV_STORAGE_KEY)',clearSource)
            assert.ok(canonical>=0)
            assert.ok(primary>canonical)
            assert.ok(clearSource>primary)
            assert.ok(clearLegacy>clearSource)
          })
          EOF

      - name: Verify focused CV storage tests
        run: node --test app/lib/cv-library.test.mjs app/lib/source-cv.test.mjs app/lib/cv-storage-single-copy.contract.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit verified fix
        run: |
          rm .github/workflows/cv-storage-quota-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main-search-base.js app/lib/cv-storage-single-copy.contract.test.mjs .github/workflows/cv-storage-quota-fix.yml
          git commit -m "fix: persist CVs only in canonical library"
          git push origin HEAD:fix/cv-storage-quota-test
