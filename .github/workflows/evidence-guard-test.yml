name: Evidence Guard test verification
on:
  push:
    branches:
      - test/evidence-guard-live-baseline
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test app/lib/evidence-guard.test.mjs app/lib/expertise-one-pass.test.mjs
      - run: npm test
      - run: npm run build
