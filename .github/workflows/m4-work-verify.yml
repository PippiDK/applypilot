name: M4 work verification

on:
  push:
    branches:
      - work/m4-10-truth-guard

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Evidence Guard tests
        if: always()
        run: node --test app/lib/evidence-guard.test.mjs
      - name: AI contract tests
        if: always()
        run: node --test app/lib/ai-contracts.test.mjs
      - name: Tailoring pipeline tests
        if: always()
        run: node --test app/lib/tailoring-pipeline.test.mjs
      - name: Adaptation client tests
        if: always()
        run: node --test app/lib/cv-adaptation-client.test.mjs
      - name: Full tests
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
