name: M4 work verification

on:
  push:
    branches:
      - work/m4-10-truth-guard

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Tests A-F
        if: always()
        shell: bash
        run: |
          files=$(find app/lib -maxdepth 1 -name '*.test.mjs' | sort | grep -Ei '/[a-f][^/]*\.test\.mjs$' || true)
          if [ -n "$files" ]; then node --test $files; fi
      - name: Tests G-L
        if: always()
        shell: bash
        run: |
          files=$(find app/lib -maxdepth 1 -name '*.test.mjs' | sort | grep -Ei '/[g-l][^/]*\.test\.mjs$' || true)
          if [ -n "$files" ]; then node --test $files; fi
      - name: Tests M-R
        if: always()
        shell: bash
        run: |
          files=$(find app/lib -maxdepth 1 -name '*.test.mjs' | sort | grep -Ei '/[m-r][^/]*\.test\.mjs$' || true)
          if [ -n "$files" ]; then node --test $files; fi
      - name: Tests S-Z
        if: always()
        shell: bash
        run: |
          files=$(find app/lib -maxdepth 1 -name '*.test.mjs' | sort | grep -Ei '/[s-z][^/]*\.test\.mjs$' || true)
          if [ -n "$files" ]; then node --test $files; fi
      - name: Full tests
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
