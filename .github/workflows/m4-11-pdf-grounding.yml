name: M4.11 PDF Grounding
on:
  push:
    branches:
      - work/m4-11-pdf-evidence-grounding-fix
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PDF artifact grounding tests
        run: node --test app/lib/evidence-grounding-pdf-artifacts.test.mjs
