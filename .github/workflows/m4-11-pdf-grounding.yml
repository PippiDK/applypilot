name: M4.11 PDF Grounding
on:
  push:
    branches:
      - work/m4-11-pdf-evidence-grounding-fix
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Targeted M4.10-M4.11 grounding tests
        run: node --test app/lib/evidence-grounding-pdf-artifacts.test.mjs app/lib/evidence-guard.test.mjs app/lib/tailoring-pipeline.test.mjs app/lib/cv-adaptation-client.test.mjs
      - name: No new full-suite regressions vs released M4.11
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/m411-base ae4a1b705744612ff8e21a754645fffa83767a56
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/m411-base/node_modules
          set +e
          (cd /tmp/m411-base && npm test > /tmp/base.log 2>&1)
          npm test > /tmp/head.log 2>&1
          set -e
          grep '^not ok ' /tmp/base.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/base.failures || true
          grep '^not ok ' /tmp/head.log | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/head.failures || true
          echo '=== BASE FAILURES ==='
          cat /tmp/base.failures
          echo '=== HEAD FAILURES ==='
          cat /tmp/head.failures
          diff -u /tmp/base.failures /tmp/head.failures
      - name: Production build
        run: npm run build
      - name: Scope and Search freeze
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only ae4a1b705744612ff8e21a754645fffa83767a56...HEAD | sort > /tmp/changed
          printf '%s\n' '.github/workflows/m4-11-pdf-grounding.yml' 'app/lib/evidence-grounding-pdf-artifacts.test.mjs' 'app/lib/evidence-guard.js' | sort > /tmp/allowed
          echo '=== CHANGED FILES ==='
          cat /tmp/changed
          diff -u /tmp/allowed /tmp/changed
