name: BUG4 RED verifier
on:
  push:
    branches:
      - feature/cv-library-3-slots
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --test app/lib/profile-eligibility-gate-regression.test.mjs
