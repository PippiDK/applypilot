name: Temporary Applied Jobs diagnostic

on:
  push:
    branches:
      - release/applied-jobs-main

permissions:
  contents: write

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/applied-jobs-main

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture full test output
        run: |
          set +e
          npm test > .applied-test-output.txt 2>&1
          code=$?
          echo "TEST_EXIT=$code" >> .applied-test-output.txt
          git config user.name "PippiDK"
          git config user.email "133820767+PippiDK@users.noreply.github.com"
          git add .applied-test-output.txt
          git commit -m "chore: capture Applied Jobs test diagnostics [skip ci]"
          git push origin HEAD:release/applied-jobs-main
          exit $code
