name: Apply CV Reupload Draft Reset

on:
  push:
    branches:
      - v18/fix-cv-reupload-clear-draft

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v18/fix-cv-reupload-clear-draft
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply targeted draft reset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/main-search-base.js')
          s=p.read_text()
          old="""      setCvLibrary(nextLibrary)\n      setProfileRoleState(EMPTY_ROLE_STATE)"""
          new="""      setCvLibrary(nextLibrary)\n      setDraft(current=>({...current,primaryRoles:[],adjacentRoles:[],roles:'',cvRoleProfiles:[],roleSources:[],rolesLibraryFingerprint:'',rolesSourceVersion:'',rolesBuilderVersion:''}))\n      setProfileRoleState(EMPTY_ROLE_STATE)"""
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one upload state transition, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Focused regression tests
        run: node --test app/lib/cv-reupload-role-cache.contract.test.mjs app/lib/search-profile-cache.test.mjs app/lib/cv-storage-single-copy.contract.test.mjs
      - name: Production build
        run: npm run build
      - name: Commit verified TEST fix
        run: |
          rm .github/workflows/apply-cv-reupload-clear-draft.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main-search-base.js app/lib/cv-reupload-role-cache.contract.test.mjs .github/workflows/apply-cv-reupload-clear-draft.yml
          git commit -m "fix: clear stale role draft while reanalysing CVs"
          git push origin HEAD:v18/fix-cv-reupload-clear-draft
