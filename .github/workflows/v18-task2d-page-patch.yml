name: V18 Task 2D page patcher

on:
  push:
    branches:
      - 'v18/night-flight-task2-profile-sync'

permissions:
  contents: write

jobs:
  patch-page:
    if: "!contains(github.event.head_commit.message, 'wire Search Profile save to Task 2D server sync')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v18/night-flight-task2-profile-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Task 2D page wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.js')
          s=p.read_text()
          old="import {requestSearchProfileRoles,requestSearchProfileExclusions} from './lib/search-profile-client.js'\n"
          new=old+"import {requestNightFlightProfileSync} from './lib/night-flight-profile-client.js'\n"
          if "requestNightFlightProfileSync" not in s:
              if old not in s: raise SystemExit('expected import anchor not found')
              s=s.replace(old,new,1)
          anchor="      localStorage.setItem('applypilot-profile',JSON.stringify(saved))"
          sync="      await requestNightFlightProfileSync({searchProfile:saved,cv:cvData?{text:cvData.cvText,sourceVersion:cvData.sourceVersion}:null})\n"
          if sync.strip() not in s:
              if anchor not in s: raise SystemExit('expected save anchor not found')
              s=s.replace(anchor,sync+anchor,1)
          p.write_text(s)
          PY
      - name: Commit exact page wiring
        run: |
          if git diff --quiet -- app/page.js; then exit 0; fi
          git config user.name "PippiDK"
          git config user.email "133820767+PippiDK@users.noreply.github.com"
          git add app/page.js
          git commit -m "feat: wire Search Profile save to Task 2D server sync"
          git push origin HEAD:v18/night-flight-task2-profile-sync
