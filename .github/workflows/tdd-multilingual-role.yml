name: TDD Multilingual Role Confirmation

on:
  push:
    branches:
      - feature/cv-library-3-slots

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --test app/lib/profile-role-confirmation-regression.test.mjs
      - run: npm run build
