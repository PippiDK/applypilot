name: UI Milestone TDD

on:
  push:
    branches:
      - feature/cv-library-3-slots

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Targeted UI contracts
        run: node --test app/lib/best-cv-ui.contract.test.mjs app/lib/job-list-ui-milestone.contract.test.mjs
      - name: Full regression tests
        run: npm test
      - name: Production build
        run: npm run build
