name: cosmetic-ui-tdd

on:
  push:
    branches:
      - feature/cv-library-3-slots

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test app/lib/cosmetic-ui.contract.test.mjs
