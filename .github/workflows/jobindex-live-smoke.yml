name: Jobindex live smoke

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  live-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect real Jobindex detail markup
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {extractJobindexSearchRecords,extractJobindexDetail} from './app/lib/jobindex-parser.js'

          const rssResponse=await fetch('https://www.jobindex.dk/jobsoegning.rss?q=Project%20Manager')
          const rss=await rssResponse.text()
          const [record]=extractJobindexSearchRecords(rss)
          if(!record) throw new Error('No Jobindex RSS record found')

          const detailResponse=await fetch(record.detailUrl,{redirect:'follow'})
          const html=await detailResponse.text()
          const parsed=extractJobindexDetail(html,{jobId:record.jobId})
          const scriptTypes=[...html.matchAll(/<script\b[^>]*type=["']([^"']+)["'][^>]*>/gi)].map(match=>match[1]).slice(0,40)
          const jobPostingPos=html.search(/JobPosting/i)
          const titlePos=html.search(/<title/i)
          const iframeHrefs=[...html.matchAll(/<iframe\b[^>]*src=["']([^"']+)["'][^>]*>/gi)].map(match=>match[1]).slice(0,20)
          const links=[...html.matchAll(/href=["']([^"']+)["']/gi)].map(match=>match[1]).filter(href=>/job|career|apply|stilling|annonce/i.test(href)).slice(0,40)

          console.log(JSON.stringify({
            record,
            response:{status:detailResponse.status,finalUrl:detailResponse.url,contentType:detailResponse.headers.get('content-type'),length:html.length},
            parsed,
            scriptTypes:[...new Set(scriptTypes)],
            iframeHrefs,
            links:[...new Set(links)],
            titleSnippet:titlePos>=0?html.slice(titlePos,titlePos+1200):'',
            jobPostingSnippet:jobPostingPos>=0?html.slice(Math.max(0,jobPostingPos-1200),jobPostingPos+3000):'',
            firstText:html.slice(0,2200),
          },null,2))

          if(!detailResponse.ok) throw new Error(`Jobindex detail HTTP ${detailResponse.status}`)
          NODE
