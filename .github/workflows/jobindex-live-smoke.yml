name: Jobindex live smoke

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  live-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect stable Jobindex detail fields
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {extractJobindexSearchRecords} from './app/lib/jobindex-parser.js'

          const rss=await (await fetch('https://www.jobindex.dk/jobsoegning.rss?q=Project%20Manager')).text()
          const [record]=extractJobindexSearchRecords(rss)
          if(!record) throw new Error('No Jobindex RSS record found')
          const response=await fetch(record.detailUrl,{redirect:'follow'})
          const html=await response.text()

          const meta=[...html.matchAll(/<meta\b([^>]+)>/gi)].map(match=>match[1]).map(attrs=>{
            const name=(attrs.match(/\b(?:name|property)=["']([^"']+)["']/i)||[])[1]||''
            const content=(attrs.match(/\bcontent=["']([^"']*)["']/i)||[])[1]||''
            return {name,content}
          }).filter(item=>/title|description|company|location|date|published|job|employment/i.test(item.name)).slice(0,80)

          const classNames=[...html.matchAll(/class=["']([^"']+)["']/gi)].flatMap(match=>match[1].split(/\s+/)).filter(value=>/job|ad|company|location|area|description|content|date/i.test(value))
          const uniqueClasses=[...new Set(classNames)].slice(0,120)
          const markers=['jobad','jobtext','job-description','jobdescription','companytext','firstdate','geoarea','jobad-element-area','jobad-content','PaidJob-inner','og:description','application_url','apply']
          const snippets={}
          for(const marker of markers){
            const pos=html.toLowerCase().indexOf(marker.toLowerCase())
            if(pos>=0) snippets[marker]=html.slice(Math.max(0,pos-900),pos+3500)
          }

          const stripped=html
            .replace(/<script[\s\S]*?<\/script>/gi,' ')
            .replace(/<style[\s\S]*?<\/style>/gi,' ')
            .replace(/<[^>]+>/g,' ')
            .replace(/&nbsp;/gi,' ')
            .replace(/&amp;/gi,'&')
            .replace(/&#x([0-9a-f]+);/gi,(_,hex)=>String.fromCodePoint(parseInt(hex,16)))
            .replace(/&#(\d+);/g,(_,num)=>String.fromCodePoint(Number(num)))
            .replace(/\s+/g,' ')
            .trim()

          console.log(JSON.stringify({record,response:{status:response.status,length:html.length},meta,uniqueClasses,snippets,visibleText:stripped.slice(0,14000)},null,2))
          if(!response.ok) throw new Error(`Jobindex detail HTTP ${response.status}`)
          NODE
