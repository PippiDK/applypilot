name: Jobindex live smoke

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  live-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect external JD structure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const external='https://stillinger.smartrekruttering.dk/job-detail/112'
          const response=await fetch(external,{redirect:'follow'})
          const html=await response.text()
          const markers=['Stillingsbeskrivelse','Short Description','Ansøgning','Education + Experience']
          const snippets={}
          for(const marker of markers){
            const pos=html.toLowerCase().indexOf(marker.toLowerCase())
            if(pos>=0) snippets[marker]=html.slice(Math.max(0,pos-2500),pos+9000)
          }
          const candidateBlocks=[]
          for(const match of html.matchAll(/<(section|article|main|div)\b([^>]*)>([\s\S]*?)<\/\1>/gi)){
            const attrs=match[2]||''
            const body=match[3]||''
            if(!/Stillingsbeskrivelse/i.test(body)) continue
            candidateBlocks.push({tag:match[1],attrs,rawLength:body.length,text:body.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim().slice(0,12000)})
            if(candidateBlocks.length>=12) break
          }
          console.log(JSON.stringify({status:response.status,length:html.length,snippets,candidateBlocks},null,2))
          if(!response.ok) throw new Error(`Employer detail HTTP ${response.status}`)
          NODE
