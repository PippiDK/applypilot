name: Jobindex live smoke

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  live-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect Jobindex HTML and RSS discovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const headers={
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'accept-language':'da-DK,da;q=0.9,en;q=0.8',
          }
          const searchUrl='https://www.jobindex.dk/jobsoegning?q=Project%20Manager'
          const htmlResponse=await fetch(searchUrl,{headers,redirect:'follow'})
          const html=await htmlResponse.text()
          const idMatch=html.match(/\bh\d{5,}\b/i)
          const id=idMatch?.[0]||''
          const pos=id?html.indexOf(id):-1

          const rssUrl='https://www.jobindex.dk/jobsoegning.rss?q=Project%20Manager'
          const rssResponse=await fetch(rssUrl,{headers:{...headers,accept:'application/rss+xml,application/xml,text/xml,*/*'},redirect:'follow'})
          const rss=await rssResponse.text()
          const itemLinks=[...rss.matchAll(/<item>[\s\S]*?<link>([\s\S]*?)<\/link>[\s\S]*?<\/item>/gi)].map(match=>match[1].trim()).slice(0,20)
          const guidValues=[...rss.matchAll(/<guid[^>]*>([\s\S]*?)<\/guid>/gi)].map(match=>match[1].trim()).slice(0,20)
          const rssIds=[...rss.matchAll(/\bh\d{5,}\b/gi)].map(match=>match[0]).slice(0,30)

          console.log(JSON.stringify({
            html:{status:htmlResponse.status,length:html.length,id,context:pos>=0?html.slice(Math.max(0,pos-700),pos+1200):''},
            rss:{status:rssResponse.status,finalUrl:rssResponse.url,contentType:rssResponse.headers.get('content-type'),length:rss.length,itemLinks,guidValues,rssIds:[...new Set(rssIds)],firstText:rss.slice(0,1800)},
          },null,2))
          if(!htmlResponse.ok||!rssResponse.ok) throw new Error(`Jobindex fetch failed: HTML ${htmlResponse.status}, RSS ${rssResponse.status}`)
          NODE
