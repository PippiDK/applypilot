name: Jobindex live smoke

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  live-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Inspect real Jobindex search response
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {extractJobindexSearchRecords} from './app/lib/jobindex-parser.js'

          const url='https://www.jobindex.dk/jobsoegning?q=Project%20Manager'
          const response=await fetch(url,{headers:{
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'accept-language':'da-DK,da;q=0.9,en;q=0.8',
          },redirect:'follow'})
          const html=await response.text()
          const hrefs=[...html.matchAll(/href=["']([^"']+)["']/gi)].map(match=>match[1])
          const jobLike=hrefs.filter(href=>/job|stilling|vis-/i.test(href)).slice(0,60)
          const ids=[...html.matchAll(/\bh\d{5,}\b/gi)].map(match=>match[0]).slice(0,30)
          const records=extractJobindexSearchRecords(html)
          console.log(JSON.stringify({
            status:response.status,
            finalUrl:response.url,
            contentType:response.headers.get('content-type'),
            length:html.length,
            visJobOccurrences:(html.match(/\/vis-job\//gi)||[]).length,
            parserRecords:records.length,
            hIds:[...new Set(ids)],
            jobLikeHrefs:[...new Set(jobLike)],
            title:(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'',
            firstText:html.slice(0,1200),
          },null,2))
          if(!response.ok) throw new Error(`Jobindex search HTTP ${response.status}`)
          NODE
