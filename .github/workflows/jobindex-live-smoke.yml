name: Jobindex live smoke

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  live-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Exercise real Jobindex adapter
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {searchJobindexSource} from './app/lib/jobindex-source-adapter.js'

          const result=await searchJobindexSource({
            freshnessDays:14,
            unionSearchPlan:{
              version:'live-smoke',
              directions:[{key:'project-manager',role:'Project Manager',query:'Project Manager',tier:'primary',origin:'manual',cvSlots:[1]}],
            },
            exclusionRules:[],
            filters:{},
            maxPages:1,
          })

          const complete=result.jobs.filter(job=>job.title&&job.company&&job.fullJd)
          console.log(JSON.stringify({
            status:result.status,
            stats:result.stats,
            completeJobs:complete.length,
            sample:complete.slice(0,3).map(job=>({
              sourceJobId:job.sourceJobId,
              title:job.title,
              company:job.company,
              location:job.location,
              remoteType:job.remoteType,
              publishedAt:job.publishedAt,
              detailUrl:job.detailUrl,
            })),
          },null,2))

          if(result.status==='failed') throw new Error(`Jobindex adapter failed: ${result.error}`)
          if(!(Number(result.stats?.discovered)>0)) throw new Error('Jobindex adapter discovered no live vacancies')
          if(!(Number(result.stats?.detailRequests)>0)) throw new Error('Jobindex adapter did not fetch live detail pages')
          if(!(result.jobs.length>0)) throw new Error('Jobindex adapter produced no normalized jobs')
          if(!(complete.length>0)) throw new Error('Jobindex adapter produced no complete normalized vacancy')
          NODE
