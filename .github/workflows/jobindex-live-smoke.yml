name: Jobindex live smoke

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  live-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Exercise real Jobindex-only flow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {runMultiSourceSearch} from './app/lib/search-source-orchestrator.js'
          import {searchJobindexSource} from './app/lib/jobindex-source-adapter.js'

          const input={
            freshnessDays:14,
            unionSearchPlan:{
              version:'live-smoke',
              directions:[{key:'project-manager',role:'Project Manager',query:'Project Manager',tier:'primary',origin:'manual',cvSlots:[1]}],
            },
            exclusionRules:[],
            enabledSources:['jobindex'],
            filters:{},
          }
          const result=await runMultiSourceSearch(input,{
            jobindex:sourceInput=>searchJobindexSource({...sourceInput,maxPages:1}),
          })
          const stats=result.stats?.sources?.jobindex||{}
          const sourceNames=Object.keys(result.sourceStatuses||{})
          const verified=result.jobs.filter(item=>item?.job?.fullJd&&item?.limitedData!==true)
          const limited=result.jobs.filter(item=>item?.limitedData===true)

          console.log(JSON.stringify({
            sourceStatus:result.sourceStatuses?.jobindex,
            sourceNames,
            acquired:result.stats?.acquired,
            deduped:result.stats?.deduped,
            returned:result.stats?.returned,
            jobindexStats:stats,
            evaluatedVerified:verified.length,
            retainedLimited:limited.length,
            sampleVerified:verified.slice(0,3).map(({job,evaluation})=>({title:job.title,company:job.company,location:job.location,publishedAt:job.publishedAt,fullJdLength:job.fullJd.length,score:evaluation?.score,detailUrl:job.detailUrl,applicationUrl:job.applicationUrl})),
            sampleLimited:limited.slice(0,3).map(({job})=>({title:job.title,company:job.company,location:job.location,detailUrl:job.detailUrl})),
          },null,2))

          if(result.allFailed||result.sourceStatuses?.jobindex?.status==='failed') throw new Error('Live Jobindex-only flow failed')
          if(sourceNames.length!==1||sourceNames[0]!=='jobindex') throw new Error('Jobindex-only selection invoked another source')
          if(!(Number(stats.discovered)>0)) throw new Error('Live Jobindex discovery returned no vacancies')
          if(!(Number(stats.detailRequests)>0)) throw new Error('Live Jobindex detail fetch did not run')
          if(!(Number(result.stats?.acquired)>0)) throw new Error('Live Jobindex produced no normalized vacancies')
          if(!(Number(stats.fullJdVerified)>0)) throw new Error('Live Jobindex verified no full job descriptions')
          NODE
