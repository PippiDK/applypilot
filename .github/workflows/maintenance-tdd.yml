name: maintenance-tdd

on:
  push:
    branches:
      - feature/cv-library-3-slots

jobs:
  targeted-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Best CV cache contract
        run: node --test app/lib/best-cv-cache.test.mjs
