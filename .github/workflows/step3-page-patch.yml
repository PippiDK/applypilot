name: Step 3 Page Patch

on:
  push:
    branches:
      - feature/cv-library-3-slots

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'wire profile discovery shadow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cv-library-3-slots
      - name: Apply minimal page wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/page.js')
          text=path.read_text()

          def one(old,new):
            global text
            count=text.count(old)
            if count!=1:
              raise SystemExit(f'Expected exactly one patch target, found {count}: {old[:100]!r}')
            text=text.replace(old,new,1)

          one(
            "import {fitLabel} from './lib/fit-label.js'\nimport SearchAudit from './components/search-audit.js'",
            "import {fitLabel} from './lib/fit-label.js'\nimport {compareShadowToLegacy} from './lib/shadow-search-compare.js'\nimport SearchAudit from './components/search-audit.js'\nimport ShadowSearchAudit from './components/shadow-search-audit.js'"
          )
          one(
            "  const [state,setState]=useState({loading:false,error:'',coverage:null,stats:null,fetchedAt:null,audit:[]})\n  const [cvData,setCvData]=useState(null)",
            "  const [state,setState]=useState({loading:false,error:'',coverage:null,stats:null,fetchedAt:null,audit:[]})\n  const [shadowState,setShadowState]=useState({status:'idle',error:'',stats:null,coverage:null,comparison:null})\n  const [cvData,setCvData]=useState(null)"
          )

          start=text.index("  async function search(){")
          end=text.index("\n\n  function startProfile(){",start)
          new_search="""  async function search(){
            if(!resumeLoaded){
              setState({loading:false,error:'Please Upload Your CV',coverage:null,stats:null,fetchedAt:null,audit:[]})
              return
            }
            setJobs([]); setState({loading:true,error:'',coverage:null,stats:null,fetchedAt:null,audit:[]})
            setShadowState({status:'idle',error:'',stats:null,coverage:null,comparison:null})
            const shadowPlan=profile?.unionSearchPlan
            const shadowPromise=Array.isArray(shadowPlan?.directions)&&shadowPlan.directions.length
              ? fetch('/api/linkedin-shadow-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({freshnessDays,unionSearchPlan:profile.unionSearchPlan})})
                  .then(async shadowRes=>{
                    const shadowData=await shadowRes.json()
                    if(!shadowRes.ok) throw new Error(shadowData.error||'LinkedIn shadow search failed')
                    return shadowData
                  })
                  .catch(error=>({__shadowError:error.message||'LinkedIn shadow search failed'}))
              : Promise.resolve(null)
            try{
              const res=await fetch('/api/linkedin-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({freshnessDays,cvText:cvData.cvText})})
              const data=await res.json()
              if(!res.ok) throw new Error(data.error||'LinkedIn search failed')
              setJobs(Array.isArray(data.jobs)?data.jobs:[])
              setState({loading:false,error:'',coverage:data.coverage||null,stats:data.stats||null,fetchedAt:data.fetchedAt||null,audit:Array.isArray(data.audit)?data.audit:[]})
              void shadowPromise.then(shadow=>{
                if(!shadow){
                  setShadowState({status:'skipped',error:'',stats:null,coverage:null,comparison:null})
                  return
                }
                if(shadow.__shadowError){
                  setShadowState({status:'error',error:shadow.__shadowError,stats:null,coverage:null,comparison:null})
                  return
                }
                setShadowState({
                  status:'ready',
                  error:'',
                  stats:shadow.stats||null,
                  coverage:shadow.coverage||null,
                  comparison:compareShadowToLegacy({
                    candidates:Array.isArray(shadow.candidates)?shadow.candidates:[],
                    legacyAudit:Array.isArray(data.audit)?data.audit:[]
                  })
                })
              })
            }catch(error){ setState({loading:false,error:error.message||'LinkedIn search failed',coverage:null,stats:null,fetchedAt:null,audit:[]}) }
          }"""
          text=text[:start]+new_search+text[end:]

          one(
            "    <SearchAudit audit={state.audit}/>\n    {state.coverage?.detail&&",
            "    <SearchAudit audit={state.audit}/>\n    <ShadowSearchAudit shadowState={shadowState}/>\n    {state.coverage?.detail&&"
          )
          path.write_text(text)
          PY
      - name: Commit page wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --check
          git commit -m "feat: wire profile discovery shadow beside legacy search"
          git push origin HEAD:feature/cv-library-3-slots
