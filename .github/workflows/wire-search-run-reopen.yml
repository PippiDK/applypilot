name: Wire Search Run Reopen Recovery

on:
  push:
    branches:
      - feature/cv-library-3-slots

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'wire Search Run reopen recovery') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch recovery wiring exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.js')
          s=p.read_text()
          old="import {runProfileSearchRun,readActiveSearchRun} from './lib/profile-search-run-client.js'"
          new="import {runProfileSearchRun,resumeActiveProfileSearchRun} from './lib/profile-search-run-client.js'"
          assert old in s
          s=s.replace(old,new,1)
          old_effect="""  useEffect(()=>{\n    if(!readActiveSearchRun(sessionStorage)) return\n    setJobs([])\n    setState({loading:true,error:'',coverage:{source:'LinkedIn Jobs',status:'SEARCHING'},stats:{discovered:0,fullJdVerified:0,evaluated:0},fetchedAt:null,audit:[]})\n    runProfileSearchRun({resume:true,storage:sessionStorage,onProgress:applySearchProgress})\n      .then(applySearchResult)\n      .catch(error=>setState({loading:false,error:error.message||'LinkedIn search failed',coverage:null,stats:null,fetchedAt:null,audit:[]}))\n  },[])\n"""
          new_effect="""  useEffect(()=>{\n    resumeActiveProfileSearchRun({storage:sessionStorage,onProgress:applySearchProgress})\n      .then(result=>{if(result) applySearchResult(result)})\n      .catch(error=>setState({loading:false,error:error.message||'LinkedIn search failed',coverage:null,stats:null,fetchedAt:null,audit:[]}))\n  },[])\n"""
          assert old_effect in s
          s=s.replace(old_effect,new_effect,1)
          p.write_text(s)
          PY
      - name: Commit recovery wiring
        run: |
          git config user.name "ApplyPilot CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.js
          git commit -m "feat: wire Search Run reopen recovery"
          git push origin HEAD:feature/cv-library-3-slots
