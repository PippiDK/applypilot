name: Jobindex diagnostic

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  diagnose-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect real Jobindex pipeline
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { extractJobindexDetail, extractJobindexExternalDetail } from './app/lib/jobindex-parser.js'

          const decode=s=>String(s||'').replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()
          const field=(item,tag)=>decode(item.match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`,'i'))?.[1]||'')
          const host=u=>{try{return new URL(u).hostname}catch{return ''}}
          const idFrom=s=>String(s||'').match(/\/vis-job\/(h\d+)/i)?.[1]||''
          const query='Project Manager'
          const rssUrl=`https://www.jobindex.dk/jobsoegning.rss?q=${encodeURIComponent(query)}`
          const rss=await fetch(rssUrl)
          const rssText=await rss.text()
          const rssMeta={status:rss.status,url:rss.url,contentType:rss.headers.get('content-type'),length:rssText.length}

          const items=[...rssText.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/gi)].map(m=>m[1])
          const rows=items.slice(0,20).map((item,index)=>{
            const title=field(item,'title')
            const link=field(item,'link')||field(item,'guid')
            const description=field(item,'description')
            return {index:index+1,id:idFrom(link)||idFrom(item),title,link,description:description.slice(0,300),titleHasProject:/\bproject\b/i.test(title),titleHasManager:/\bmanager\b/i.test(title)}
          })
          const titleCounts={items:items.length,projectTitle:rows.filter(x=>x.titleHasProject).length,managerTitle:rows.filter(x=>x.titleHasManager).length,neither:rows.filter(x=>!x.titleHasProject&&!x.titleHasManager).length}
          const details=[]

          for(const row of rows.slice(0,12)){
            if(!row.id) continue
            const detailUrl=`https://www.jobindex.dk/vis-job/${row.id}`
            let detailResponse,detailHtml=''
            try{
              detailResponse=await fetch(detailUrl)
              detailHtml=await detailResponse.text()
            }catch(error){
              details.push({id:row.id,rssTitle:row.title,detailError:String(error)})
              continue
            }
            const detail=extractJobindexDetail(detailHtml,{jobId:row.id})
            const externalAnchors=[...detailHtml.matchAll(/<a\b[^>]*href=["'](https?:\/\/[^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)].slice(0,12).map(m=>({href:m[1],label:decode(m[2]).slice(0,120),host:host(m[1])}))
            const base={id:row.id,rssTitle:row.title,status:detailResponse.status,length:detailHtml.length,title:detail.title,company:detail.company,location:detail.location,applicationUrl:detail.applicationUrl,applicationHost:host(detail.applicationUrl),jobindexFullJdLength:String(detail.fullJd||'').length,teaserLength:String(detail.teaser||'').length,externalAnchors}
            if(!detail.applicationUrl||String(detail.fullJd||'').length>=500){
              details.push({...base,external:null})
              continue
            }
            try{
              const ext=await fetch(detail.applicationUrl)
              const extHtml=await ext.text()
              const parsed=extractJobindexExternalDetail(extHtml,{url:detail.applicationUrl})
              details.push({...base,external:{status:ext.status,finalUrl:ext.url,finalHost:host(ext.url),contentType:ext.headers.get('content-type'),length:extHtml.length,fullJdLength:String(parsed.fullJd||'').length,title:parsed.title,company:parsed.company,hasJobPosting:/["']JobPosting["']/i.test(extHtml),looksBlocked:/access denied|forbidden|captcha|cloudflare|bot detection|request blocked/i.test(extHtml.slice(0,12000)),htmlSignals:{workday:/workday/i.test(extHtml.slice(0,50000)),successFactors:/successfactors/i.test(extHtml.slice(0,50000)),teamtailor:/teamtailor/i.test(extHtml.slice(0,50000)),smartRecruiters:/smartrecruiters/i.test(extHtml.slice(0,50000)),recruitee:/recruitee/i.test(extHtml.slice(0,50000))}}})
            }catch(error){
              details.push({...base,external:{error:String(error)}})
            }
          }

          const diagnostic={query,rssMeta,titleCounts,rows,details}
          fs.writeFileSync('jobindex-diagnostic.json',JSON.stringify(diagnostic,null,2))
          console.log(JSON.stringify(diagnostic,null,2))
          NODE
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobindex-diagnostic
          path: jobindex-diagnostic.json
          retention-days: 1
