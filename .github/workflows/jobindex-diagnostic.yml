name: Jobindex diagnostic

on:
  push:
    branches:
      - feature/jobindex-multisource-search

jobs:
  diagnose-jobindex:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Jobindex query operators
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const decode=s=>String(s||'').replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g,'$1').replace(/&#x([0-9a-f]+);/gi,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()
          const field=(item,tag)=>decode(item.match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)<\\/${tag}>`,'i'))?.[1]||'')
          const idFrom=s=>String(s||'').match(/\/vis-job\/(h\d+)/i)?.[1]||''
          async function read(query){
            const u=new URL('https://www.jobindex.dk/jobsoegning.rss');u.searchParams.set('q',query)
            const r=await fetch(u);const text=await r.text();const items=[...text.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/gi)].map(m=>m[1])
            const rows=items.slice(0,20).map(item=>{const title=field(item,'title');const link=field(item,'link')||field(item,'guid');return {id:idFrom(link)||idFrom(item),title}})
            return {query,status:r.status,itemCount:items.length,rows,titleProject:rows.filter(x=>/\bproject\b/i.test(x.title)).length,titleDelivery:rows.filter(x=>/\bdelivery\b/i.test(x.title)).length,titleManager:rows.filter(x=>/\bmanager\b/i.test(x.title)).length}
          }
          const queries=['Project Manager','+Project +Manager','"Project Manager"','Delivery Manager','+Delivery +Manager','"Delivery Manager"']
          const feeds=[];for(const q of queries) feeds.push(await read(q))
          fs.writeFileSync('jobindex-diagnostic.json',JSON.stringify({feeds},null,2))
          console.log(JSON.stringify({feeds},null,2))
          NODE
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobindex-diagnostic
          path: jobindex-diagnostic.json
          retention-days: 1
