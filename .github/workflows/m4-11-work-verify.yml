name: M4.11 Work Verify

on:
  push:
    branches:
      - work/m4-11-review-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: M4.11 targeted tests
        run: node --test app/lib/cv-adaptation-decisions.test.mjs app/lib/cv-adaptation-review-ui.contract.test.mjs
      - name: Build
        run: npm run build
      - name: Search freeze diff
        run: |
          git diff --exit-code 0a5f3541dcab0423724e8dde02412d0fb582a253 -- \
            app/lib/linkedin-profile-search.js \
            app/api/linkedin-profile-search/route.js \
            app/lib/linkedin-shadow-discovery.js \
            app/lib/linkedin-search.js \
            app/api/linkedin-search/route.js \
            app/lib/union-search-plan.js
