name: M4.11 Work Verify

on:
  push:
    branches:
      - work/m4-11-review-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: M4.11 targeted tests
        run: node --test app/lib/cv-adaptation-decisions.test.mjs app/lib/cv-adaptation-review-ui.contract.test.mjs
      - name: No new full-suite regressions vs M4.10
        run: |
          set +e
          npm test > /tmp/m4-11-head.log 2>&1
          HEAD_EXIT=$?
          git worktree add --detach /tmp/m4-10-base 0a5f3541dcab0423724e8dde02412d0fb582a253
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/m4-10-base/node_modules
          (cd /tmp/m4-10-base && npm test > /tmp/m4-10-base.log 2>&1)
          BASE_EXIT=$?
          set -e
          grep -E '^[[:space:]#]*not ok [0-9]+ - ' /tmp/m4-10-base.log | sed -E 's/^[[:space:]#]*not ok [0-9]+ - //' | sed -E 's/ #.*$//' | sort -u > /tmp/base.fail || true
          grep -E '^[[:space:]#]*not ok [0-9]+ - ' /tmp/m4-11-head.log | sed -E 's/^[[:space:]#]*not ok [0-9]+ - //' | sed -E 's/ #.*$//' | sort -u > /tmp/head.fail || true
          echo "M4.10 baseline exit: $BASE_EXIT"
          echo "M4.11 head exit: $HEAD_EXIT"
          echo "Known M4.10 failures:"
          cat /tmp/base.fail || true
          echo "M4.11 failures:"
          cat /tmp/head.fail || true
          NEW_FAILURES=$(comm -13 /tmp/base.fail /tmp/head.fail)
          if [ -n "$NEW_FAILURES" ]; then
            echo "New M4.11 failures detected:"
            echo "$NEW_FAILURES"
            exit 1
          fi
          if [ "$BASE_EXIT" -eq 0 ] && [ "$HEAD_EXIT" -ne 0 ]; then
            echo "M4.10 was green but M4.11 full suite failed."
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Search freeze diff
        run: |
          git diff --exit-code 0a5f3541dcab0423724e8dde02412d0fb582a253 -- \
            app/lib/linkedin-profile-search.js \
            app/api/linkedin-profile-search/route.js \
            app/lib/linkedin-shadow-discovery.js \
            app/lib/linkedin-search.js \
            app/api/linkedin-search/route.js \
            app/lib/union-search-plan.js
