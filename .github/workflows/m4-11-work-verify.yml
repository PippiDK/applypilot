name: M4.11 Work Verify

on:
  push:
    branches:
      - work/m4-11-review-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: M4.11 targeted tests
        run: node --test app/lib/cv-adaptation-decisions.test.mjs app/lib/cv-adaptation-review-ui.contract.test.mjs
