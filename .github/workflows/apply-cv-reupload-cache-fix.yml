name: Apply CV Reupload Cache Fix

on:
  push:
    branches:
      - fix/cv-reupload-role-cache

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cv-reupload-role-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply targeted CV role cache invalidation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/main-search-base.js')
          s=p.read_text()
          old="import {SEARCH_PROFILE_BUILDER_VERSION,readSearchProfileCache,writeSearchProfileCache,resolveSearchProfileExclusions} from './lib/search-profile-cache.js'"
          new="import {SEARCH_PROFILE_BUILDER_VERSION,readSearchProfileCache,writeSearchProfileCache,clearSearchProfileCache,resolveSearchProfileExclusions} from './lib/search-profile-cache.js'"
          if s.count(old)!=1:
              raise SystemExit(f'Expected one cache import, found {s.count(old)}')
          s=s.replace(old,new,1)
          old2="localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(nextLibrary))\n      setCvLibrary(nextLibrary)"
          new2="localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(nextLibrary))\n      clearSearchProfileCache({storage:localStorage,sourceVersion:saved.sourceVersion})\n      setCvLibrary(nextLibrary)"
          if s.count(old2)!=1:
              raise SystemExit(f'Expected one upload library write, found {s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Add integration regression contract
        run: |
          cat > app/lib/cv-reupload-role-cache.contract.test.mjs <<'EOF'
          import test from 'node:test'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const source=fs.readFileSync(new URL('../main-search-base.js',import.meta.url),'utf8')

          test('successful CV upload invalidates only that CV role cache after library persistence',()=>{
            const parseStart=source.indexOf('async function parseCv')
            const libraryWrite=source.indexOf('localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(nextLibrary))',parseStart)
            const cacheClear=source.indexOf('clearSearchProfileCache({storage:localStorage,sourceVersion:saved.sourceVersion})',libraryWrite)
            const libraryState=source.indexOf('setCvLibrary(nextLibrary)',cacheClear)
            assert.ok(parseStart>=0)
            assert.ok(libraryWrite>parseStart)
            assert.ok(cacheClear>libraryWrite)
            assert.ok(libraryState>cacheClear)
          })
          EOF
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        run: |
          rm .github/workflows/apply-cv-reupload-cache-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+PippiDK@users.noreply.github.com"
          git add app/main-search-base.js app/lib/search-profile-cache.js app/lib/search-profile-cache.test.mjs app/lib/cv-reupload-role-cache.contract.test.mjs .github/workflows/apply-cv-reupload-cache-fix.yml
          git commit -m "fix: reanalyse uploaded CV roles instead of reusing cache"
          git push origin HEAD:fix/cv-reupload-role-cache
