name: BUG4 Final verifier
on:
  push:
    branches:
      - feature/cv-library-3-slots
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Eligibility and multilingual regressions
        run: node --test app/lib/profile-role-family.test.mjs app/lib/profile-delivery-domain.test.mjs app/lib/profile-semantic-exclusions.test.mjs app/lib/profile-eligibility-gate-regression.test.mjs app/lib/profile-role-confirmation-regression.test.mjs
      - name: Search Run discovery batch
        run: node --test app/lib/linkedin-profile-discovery-batch.test.mjs
      - name: JD batch - continuation after 30
        run: node --test --test-name-pattern="candidate 31" app/lib/linkedin-profile-jd-batch.test.mjs
      - name: JD batch - safe time budget
        run: node --test --test-name-pattern="safe time budget" app/lib/linkedin-profile-jd-batch.test.mjs
      - name: JD batch - inaccessible JD
        run: node --test --test-name-pattern="inaccessible JD" app/lib/linkedin-profile-jd-batch.test.mjs
      - name: JD batch - HOLD audit
        run: node --test --test-name-pattern="ambiguous HOLD" app/lib/linkedin-profile-jd-batch.test.mjs
      - name: Search Run store
        run: node --test app/lib/search-run-store.test.mjs
      - name: Search Run client
        run: node --test app/lib/profile-search-run-client.test.mjs
      - name: Union Search Plan
        run: node --test app/lib/union-search-plan.test.mjs
      - name: Union Search Plan wiring
        run: node --test app/lib/union-search-plan-wiring.test.mjs
      - name: Profile-driven live contract
        run: node --test app/lib/profile-driven-live.contract.test.mjs
      - name: Profile shadow wiring
        run: node --test app/lib/profile-shadow-wiring.test.mjs
      - name: Search Profile exclusions save UI
        run: node --test app/lib/search-profile-exclusions-save-ui.test.mjs
      - name: Production build
        run: npm run build
      - name: Full repository suite
        continue-on-error: true
        run: npm test
