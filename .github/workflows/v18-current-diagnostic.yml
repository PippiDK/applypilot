name: V18 current full-suite diagnostic

on:
  push:
    branches:
      - 'v18/diag2-night-flight-right-panel'

permissions:
  contents: write

jobs:
  diagnose:
    if: "!contains(github.event.head_commit.message, 'capture compact test diagnostic')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests and capture compact failures
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > /tmp/install.log 2>&1
          npm test > /tmp/test.log 2>&1
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/test.log').read_text(errors='replace').splitlines()
          out=[]
          for i,line in enumerate(lines):
              if line.startswith('not ok '):
                  out.append(line)
                  for extra in lines[i+1:i+14]:
                      stripped=extra.strip()
                      if stripped.startswith('location:') or stripped.startswith('error:'):
                          out.append('  '+stripped)
                  out.append('')
          out.append('--- summary ---')
          out.extend(lines[-25:])
          Path('current-test-diagnostic.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit compact diagnostic
        run: |
          git config user.name "PippiDK"
          git config user.email "133820767+PippiDK@users.noreply.github.com"
          git add current-test-diagnostic.txt
          git commit -m "chore: capture compact test diagnostic"
          git push origin HEAD:v18/diag2-night-flight-right-panel
