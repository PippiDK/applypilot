name: M4 Direct AI Adaptation
on:
  push:
    branches:
      - work/m4-direct-ai-adaptation
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Direct adaptation contract
        run: node --test app/lib/direct-cv-adaptation.test.mjs
      - name: Locate superseded Truth Guard tests
        shell: bash
        run: |
          set -euo pipefail
          for title in \
            "Adapt & review CV runs the selected-CV Truth Guard pipeline only on explicit user action" \
            "CV Update Review is driven by explicit selected-CV adaptation rather than a standalone JD cache pretest" \
            "CV Update Review keeps a focused review instead of the obsolete dashboard-style Truth Guard panel" \
            "JD qualification detail stays inside the adaptation pipeline instead of being duplicated in review UI" \
            "M4.11 CV review shows a neutral empty state when Truth Guard offers no changed safe block" \
            "M4.11 UI supersedes the legacy Summary-only review with three Truth-Guard-safe blocks" \
            "M4.11 page runs the real selected-CV Truth Guard pipeline before opening review" \
            "M4.11 review exposes all three approved CV blocks instead of Summary-only pretest UI" \
            "merged UI keeps Application Pack and exposes the M4.11 Truth-Guard review flow" \
            "obsolete JD ANALYSIS PRETEST dashboard is removed from M4.11 review" \
            "tailor-cv authorizes before request parsing or provider/business work"; do
            echo "=== $title ==="
            grep -RFl -- "$title" app/lib || true
          done
      - name: Active M4 path has no Evidence Mapping or Truth Guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "map_selected_cv_evidence\|run_truth_guard\|analyze_job" app/api/tailor-cv/route.js
          ! grep -q "requestTruthGuard\|safeAdaptationReviewBlocks\|Truth Guard complete\|selected-CV evidence" app/page.js
      - name: Search freeze
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only ae4a1b705744612ff8e21a754645fffa83767a56...HEAD > /tmp/changed
          for path in \
            app/lib/linkedin-profile-search.js \
            app/api/linkedin-profile-search/route.js \
            app/lib/linkedin-shadow-discovery.js \
            app/lib/linkedin-search.js \
            app/api/linkedin-search/route.js \
            app/lib/union-search-plan.js; do
            if grep -Fxq "$path" /tmp/changed; then
              echo "Frozen Search file changed: $path"
              exit 1
            fi
          done
      - name: Production build
        run: npm run build
