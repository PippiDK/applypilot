name: M4 Direct AI Adaptation
on:
  push:
    branches:
      - work/m4-direct-ai-adaptation
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply direct adaptation simplification
        run: python .github/scripts/m4_direct_ai_adaptation.py
      - name: Commit simplification when needed
        shell: bash
        run: |
          git config user.name "applypilot-ci"
          git config user.email "applypilot-ci@users.noreply.github.com"
          git add app/lib/tailoring-pipeline.js app/lib/previous-role-overview.js app/lib/cv-adaptation-client.js app/lib/cv-adaptation-decisions.js app/api/tailor-cv/route.js app/page.js
          if ! git diff --cached --quiet; then
            git commit -m "refactor: simplify M4 to direct AI adaptation"
            git push origin HEAD:work/m4-direct-ai-adaptation
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Direct adaptation contract
        run: node --test app/lib/direct-cv-adaptation.test.mjs
      - name: Legacy M4 contracts still compile
        run: node --test app/lib/cv-adaptation-client.test.mjs app/lib/cv-adaptation-decisions.test.mjs app/lib/tailoring-pipeline.test.mjs app/lib/previous-role-overview.test.mjs
      - name: Production build
        run: npm run build
