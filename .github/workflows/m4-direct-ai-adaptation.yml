          client_direct="""export async function requestCvAdaptation({baseline,job,fetchImpl=fetch}={}){
  const input=buildAdaptationInput({baseline,job})
  const summary=await postJson(fetchImpl,{action:'write_professional_summary',sourceCv:input.sourceCv,job:input.job})
  if(summary?.stage!=='summary_written'||summary?.block?.blockId!=='professional_summary') throw new Error('Professional Summary writing did not complete.')
  const latest=await postJson(fetchImpl,{action:'write_latest_role_overview',sourceCv:input.sourceCv,job:input.job})
  if(latest?.stage!=='latest_role_written'||latest?.block?.blockId!=='latest_role_overview') throw new Error('Latest role overview writing did not complete.')
  const previous=await postJson(fetchImpl,{action:'write_previous_role_overview',sourceCv:input.sourceCv,job:input.job})
  if(previous?.stage!=='previous_role_written'||previous?.block?.blockId!=='previous_role_overview') throw new Error('Previous role overview writing did not complete.')
  return {stage:'adaptation_written',blocks:{professionalSummary:summary.block,latestRoleOverview:latest.block,previousRoleOverview:previous.block}}
}

async function runEvidenceStages({input,fetchImpl}){"""
          replace_once(client,client_marker,client_direct)

          decisions='app/lib/cv-adaptation-decisions.js'
          decisions_marker="export function safeAdaptationReviewBlocks({blocks={},truthGuard={}}={}){"
          decisions_direct="""export function adaptationReviewBlocks({blocks={}}={}){
  const review=[]
  for(const definition of REVIEW_BLOCKS){
    const block=blocks?.[definition.key]
    if(block?.status!=='generated'||text(block?.blockId)!==definition.blockId) continue
    const original=text(block.originalText)
    const updated=text(block.tailoredText)
    if(!original||!updated||original===updated) continue
    review.push({blockId:definition.blockId,label:definition.label,original,updated,why:text(block.why)||'Updated for this vacancy.'})
  }
  return review
}

export function safeAdaptationReviewBlocks({blocks={},truthGuard={}}={}){"""
          replace_once(decisions,decisions_marker,decisions_direct)

          route=Path('app/api/tailor-cv/route.js')
          route_text="""import {NextResponse} from 'next/server'
import {writeProfessionalSummary,writeLatestRoleOverview} from '../../lib/tailoring-pipeline.js'
import {writePreviousRoleOverview} from '../../lib/previous-role-overview.js'
import {detectCvStructure} from '../../lib/cv-sections.js'
import {requireUser} from '../../lib/auth/require-user.js'

export const dynamic='force-dynamic'
const text=value=>String(value??'').trim()
const raw=value=>String(value??'')

function requestJob(value={}){
  return {sourceJobId:text(value?.sourceJobId),title:text(value?.title),company:text(value?.company),location:text(value?.location),description:text(value?.description)}
}

function requestSourceCv(value={}){
  return {cvId:text(value?.cvId),sourceVersion:text(value?.sourceVersion),fileName:text(value?.fileName),cvText:raw(value?.cvText)}
}

function validateSelectedCvRequest({job,sourceCv}){
  if(!job.title||job.description.length<80) return 'A usable vacancy is required for adaptation.'
  if(!sourceCv.cvId||!sourceCv.sourceVersion||!sourceCv.fileName||sourceCv.cvText.trim().length<100) return 'A complete selected CV is required for adaptation.'
  return ''
}

export async function GET(){
  const auth=await requireUser()
  if(!auth.user) return auth.response
  return NextResponse.json({error:'Retired in ApplyPilot v1.0. LinkedIn-only milestone is active.'},{status:410})
}

export async function POST(request){
  const auth=await requireUser()
  if(!auth.user) return auth.response

  let action=''
  try{
    const body=await request.json()
    action=text(body?.action)
    const job=requestJob(body?.job)
    const sourceCv=requestSourceCv(body?.sourceCv)
    const requestError=validateSelectedCvRequest({job,sourceCv})
    if(requestError) return NextResponse.json({error:requestError},{status:400})
    const structure=detectCvStructure(sourceCv.cvText)

    if(action==='write_professional_summary'){
      const block=await writeProfessionalSummary({job,sourceCv,structure})
      return NextResponse.json({stage:'summary_written',block})
    }
    if(action==='write_latest_role_overview'){
      const block=await writeLatestRoleOverview({job,sourceCv,structure})
      return NextResponse.json({stage:'latest_role_written',block})
    }
    if(action==='write_previous_role_overview'){
      const block=await writePreviousRoleOverview({job,sourceCv,structure})
      return NextResponse.json({stage:'previous_role_written',block})
    }
    return NextResponse.json({error:'Unsupported tailoring action.'},{status:400})
  }catch{
    const error=action==='write_professional_summary'
      ?'Professional Summary writing failed. Please try again.'
      :action==='write_latest_role_overview'
        ?'Latest role overview writing failed. Please try again.'
        :action==='write_previous_role_overview'
          ?'Previous role overview writing failed. Please try again.'
          :'CV adaptation failed. Please try again.'
    return NextResponse.json({error},{status:502})
  }
}
"""
