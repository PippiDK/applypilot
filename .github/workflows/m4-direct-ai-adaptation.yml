name: M4 Direct AI Adaptation
on:
  push:
    branches:
      - work/m4-direct-ai-adaptation
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update superseded M4 contracts
        run: python .github/scripts/m4_update_direct_spec_tests.py
      - name: Commit updated contracts when needed
        shell: bash
        run: |
          git config user.name "applypilot-ci"
          git config user.email "applypilot-ci@users.noreply.github.com"
          git add app/lib/auth-private-api-guard.test.mjs app/lib/cv-adaptation-review-ui.contract.test.mjs app/lib/v16-cv-review.contract.test.mjs app/lib/jd-analysis-ui.contract.test.mjs app/lib/profile-review.test.mjs app/lib/tailor-cv-api.contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "test: align M4 contracts with direct AI adaptation"
            git push origin HEAD:work/m4-direct-ai-adaptation
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Direct adaptation contract
        run: node --test app/lib/direct-cv-adaptation.test.mjs
      - name: Full suite
        run: npm test
      - name: Active M4 path has no Evidence Mapping or Truth Guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "map_selected_cv_evidence\|run_truth_guard\|analyze_job" app/api/tailor-cv/route.js
          ! grep -q "requestTruthGuard\|safeAdaptationReviewBlocks\|Truth Guard complete\|selected-CV evidence" app/page.js
      - name: Search freeze
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only ae4a1b705744612ff8e21a754645fffa83767a56...HEAD > /tmp/changed
          for path in \
            app/lib/linkedin-profile-search.js \
            app/api/linkedin-profile-search/route.js \
            app/lib/linkedin-shadow-discovery.js \
            app/lib/linkedin-search.js \
            app/api/linkedin-search/route.js \
            app/lib/union-search-plan.js; do
            if grep -Fxq "$path" /tmp/changed; then
              echo "Frozen Search file changed: $path"
              exit 1
            fi
          done
      - name: Production build
        run: npm run build
