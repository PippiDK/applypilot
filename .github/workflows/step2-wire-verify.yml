name: Step 2 Wire and Verify

on:
  push:
    branches:
      - feature/cv-library-3-slots

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund

      - name: Confirm wiring test is RED before implementation
        run: |
          if node --test app/lib/union-search-plan-wiring.test.mjs; then
            echo "Expected pre-implementation wiring contract to fail"
            exit 1
          else
            echo "RED confirmed"
          fi

      - name: Apply Step 2 page wiring only
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/page.js')
          source=path.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global source
              count=source.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              source=source.replace(old,new,1)

          replace_once(
              "import {buildCvRoleProfile,combineCvRoleProfiles,searchProfileLibraryFingerprint} from './lib/search-profile-library.js'\n",
              "import {buildCvRoleProfile,combineCvRoleProfiles,searchProfileLibraryFingerprint} from './lib/search-profile-library.js'\nimport {buildUnionSearchPlan,UNION_SEARCH_PLAN_VERSION} from './lib/union-search-plan.js'\n",
              'union plan import'
          )
          replace_once(
              "import SearchProfileLocationStep from './components/search-profile-location-step.js'\n",
              "import SearchProfileLocationStep from './components/search-profile-location-step.js'\nimport SearchPlanPreview from './components/search-plan-preview.js'\n",
              'preview import'
          )
          replace_once(
              "  const draftAdjacentRoles=roleList(draft.adjacentRoles)\n  const draftPreferences=normalizeSearchPreferences(draft)\n",
              "  const draftAdjacentRoles=roleList(draft.adjacentRoles)\n  const draftUnionSearchPlan=useMemo(()=>buildUnionSearchPlan({primaryRoles:draftPrimaryRoles,adjacentRoles:draftAdjacentRoles,roleSources:Array.isArray(draft.roleSources)?draft.roleSources:[],cvRoleProfiles:Array.isArray(draft.cvRoleProfiles)?draft.cvRoleProfiles:[]}),[draftPrimaryRoles,draftAdjacentRoles,draft.roleSources,draft.cvRoleProfiles])\n  const draftPreferences=normalizeSearchPreferences(draft)\n",
              'draft plan memo'
          )
          replace_once(
              "rolesBuilderVersion:SEARCH_PROFILE_BUILDER_VERSION,locations,workModels",
              "rolesBuilderVersion:SEARCH_PROFILE_BUILDER_VERSION,unionSearchPlan:draftUnionSearchPlan,unionSearchPlanVersion:UNION_SEARCH_PLAN_VERSION,unionSearchPlanFingerprint:draftUnionSearchPlan.fingerprint,locations,workModels",
              'saved plan snapshot'
          )
          replace_once(
              "<div className=\"reviewRow\"><span>Exclude</span><b>{draft.exclusions||'None'}</b></div>{profileSaveState.error&&",
              "<div className=\"reviewRow\"><span>Exclude</span><b>{draft.exclusions||'None'}</b></div><SearchPlanPreview plan={draftUnionSearchPlan}/>{profileSaveState.error&&",
              'confirm preview'
          )

          path.write_text(source,encoding='utf-8')
          PY

      - name: Step 2 targeted tests GREEN
        run: node --test app/lib/union-search-plan.test.mjs app/lib/union-search-plan-ui-contract.test.mjs app/lib/union-search-plan-wiring.test.mjs

      - name: Step 1 regression tests
        run: node --test app/lib/search-profile-library.test.mjs app/lib/search-profile-cache.test.mjs app/lib/multi-cv-search-profile-contract.test.mjs

      - name: Production build
        run: npm run build

      - name: Commit verified page wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git diff --cached --quiet && { echo "No page wiring diff produced"; exit 1; }
          git commit -m "feat: save union search plan snapshot"
          git push origin HEAD:feature/cv-library-3-slots
