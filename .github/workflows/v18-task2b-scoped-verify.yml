name: V18 Task 2B scoped verification

on:
  push:
    branches:
      - 'v18/night-flight-task2-profile-sync'
  workflow_dispatch:

jobs:
  verify-task2b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Task 2A and Task 2B
        run: node --test app/lib/night-flight-profile-state.test.mjs app/lib/night-flight-profile-store.test.mjs
      - name: Build
        run: npm run build
