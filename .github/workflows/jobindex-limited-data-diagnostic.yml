name: Jobindex LIMITED_DATA diagnostic

on:
  push:
    branches:
      - diag/jobindex-limited-data

jobs:
  locate-teamtailor-case:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Senior HR Business Partner and trace retrieval
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {extractJobindexSearchRecords,extractJobindexDetail,extractJobindexExternalDetail} from './app/lib/jobindex-parser.js'
          import {recoverExternalFullJd} from './app/lib/jobindex-live-retrieval.js'
          import {jobindexCanonicalFullJdUrl,jobindexApplyTrackerUrl} from './app/lib/jobindex-retrieval-fallbacks.js'

          const queries=['Business Partner','HR Business Partner','Business Transformation Manager','Transformation Manager','Project Manager','Technical Project Manager','Programme Manager','Implementation Manager','Integration Manager','PMO Manager','Portfolio Manager','Governance Manager']
          let target=null
          for(const query of queries){
            const url=new URL('https://www.jobindex.dk/jobsoegning.rss');url.searchParams.set('q',query)
            const r=await fetch(url,{redirect:'follow'});const rss=await r.text();const records=extractJobindexSearchRecords(rss)
            const matches=records.filter(row=>/Senior HR Business Partner/i.test(row.title||''))
            console.log('QUERY',query,'records',records.length,'matches',matches.map(x=>({jobId:x.jobId,title:x.title})))
            if(!target&&matches[0]) target={...matches[0],query}
          }
          if(!target) throw new Error('Target vacancy not found in diagnostic query set')

          const detailResponse=await fetch(target.detailUrl,{redirect:'follow'})
          const detailHtml=await detailResponse.text()
          const detail=extractJobindexDetail(detailHtml,{jobId:target.jobId})
          const applicationUrl=detail.applicationUrl||jobindexApplyTrackerUrl(detailHtml)
          const canonicalUrl=jobindexCanonicalFullJdUrl(detailHtml)
          const result={target,detail:{title:detail.title,company:detail.company,location:detail.location,postedDate:detail.postedDate,applicationUrl,canonicalUrl,fullJdLength:String(detail.fullJd||'').length}}

          if(applicationUrl){
            try{
              const r=await fetch(applicationUrl,{redirect:'follow'})
              const html=await r.text()
              const parsed=extractJobindexExternalDetail(html,{url:r.url||applicationUrl})
              const recovered=recoverExternalFullJd(html,r.url||applicationUrl)
              const lower=html.toLowerCase();const snippets={}
              for(const needle of ['Senior HR Business Partner','Struers','Teamtailor','job-description','job_description','application/ld+json']){const i=lower.indexOf(needle.toLowerCase());if(i>=0)snippets[needle]=html.slice(Math.max(0,i-1200),i+6000).replace(/\s+/g,' ').trim()}
              result.application={status:r.status,finalUrl:r.url,contentType:r.headers.get('content-type'),length:html.length,parsedLength:String(parsed.fullJd||'').length,recoveredLength:String(recovered||'').length,hasJsonLd:/application\/ld\+json/i.test(html),snippets}
            }catch(error){result.application={error:String(error?.message||error)}}
          }
          console.log('RESULT '+JSON.stringify(result,null,2))
          NODE
