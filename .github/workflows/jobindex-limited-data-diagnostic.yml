name: Jobindex LIMITED_DATA diagnostic

on:
  push:
    branches:
      - diag/jobindex-limited-data

jobs:
  inspect-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect raw LIMITED_DATA employer pages
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {extractJobindexExternalDetail} from './app/lib/jobindex-parser.js'

          const cases=[
            ['Ennova','Studentermedhjælper til IT','https://www.ennova.com/en/ennova-career-job?VID=20260818'],
            ['Ege Carpets','IT Supporter med ansvar for Servicedesk','https://www.egecarpets.com/da-dk/om-ege-carpets/job-og-karriere/it--supporter--med--ansvar--for--servicedesk-3410'],
            ['Kalundborg Refinery','Selvdreven projektleder til Project Execution','https://career.kalundborgrefinery.com/administration/'],
            ['DSE Test Solutions','Technical specialist - Wire testing instruments','https://cloudcruit.cruitconsult.dk/annonce.asp?AdvertID=255'],
            ['Phillips-Medisize','Regulatory Affairs Specialist','https://koch.avature.net/en_US/careers/JobDetail/Regulatory-Affairs-Specialist/193263'],
            ['Third.space','Sales & Project Coordinator til barselsvikariat hos Third.space','https://ilva.youngcrm.com/jobportal/12750'],
          ]

          const clean=s=>String(s||'').replace(/\s+/g,' ').trim()
          for(const [company,title,url] of cases){
            const row={company,title,url}
            try{
              const response=await fetch(url,{redirect:'follow'})
              const html=await response.text()
              const parsed=extractJobindexExternalDetail(html,{url:response.url||url})
              const low=html.toLowerCase()
              row.status=response.status
              row.finalUrl=response.url
              row.contentType=response.headers.get('content-type')
              row.length=html.length
              row.parsedFullJdLength=String(parsed?.fullJd||'').length
              row.parsedTitle=parsed?.title||''
              row.hasJsonLd=/application\/ld\+json/i.test(html)
              row.hasNextData=/__NEXT_DATA__/i.test(html)
              row.hasNuxt=/__NUXT__/i.test(html)
              row.hasTitleText=low.includes(title.toLowerCase())
              row.scriptSrc=[...html.matchAll(/<script\b[^>]*src=["']([^"']+)["']/gi)].slice(0,12).map(m=>m[1])
              const needle=title.split(/\s+/).filter(Boolean).slice(0,3).join(' ').toLowerCase()
              const index=needle?low.indexOf(needle):-1
              row.snippet=clean(index>=0?html.slice(Math.max(0,index-700),index+2500):html.slice(0,2500))
            }catch(error){
              row.error=String(error?.message||error)
            }
            console.log('CASE '+JSON.stringify(row,null,2))
          }
          NODE
