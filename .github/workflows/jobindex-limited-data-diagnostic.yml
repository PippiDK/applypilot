name: Jobindex LIMITED_DATA diagnostic

on:
  push:
    branches:
      - diag/jobindex-limited-data

jobs:
  teamtailor-case:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace Senior HR Business Partner retrieval
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {extractJobindexSearchRecords,extractJobindexDetail,extractJobindexExternalDetail} from './app/lib/jobindex-parser.js'
          import {recoverExternalFullJd} from './app/lib/jobindex-live-retrieval.js'
          import {jobindexCanonicalFullJdUrl,jobindexApplyTrackerUrl} from './app/lib/jobindex-retrieval-fallbacks.js'

          const clean=s=>String(s||'').replace(/\s+/g,' ').trim()
          const rssUrl=new URL('https://www.jobindex.dk/jobsoegning.rss')
          rssUrl.searchParams.set('q','Senior HR Business Partner')
          const rssResponse=await fetch(rssUrl,{redirect:'follow'})
          const rss=await rssResponse.text()
          const records=extractJobindexSearchRecords(rss)
          const record=records.find(row=>/Senior HR Business Partner/i.test(row.title||''))
          if(!record) throw new Error('Target Jobindex record not found')

          const detailResponse=await fetch(record.detailUrl,{redirect:'follow'})
          const detailHtml=await detailResponse.text()
          const detail=extractJobindexDetail(detailHtml,{jobId:record.jobId})
          const applicationUrl=detail.applicationUrl||jobindexApplyTrackerUrl(detailHtml)
          const canonicalUrl=jobindexCanonicalFullJdUrl(detailHtml)

          const result={record,detail:{title:detail.title,company:detail.company,location:detail.location,postedDate:detail.postedDate,applicationUrl,canonicalUrl,fullJdLength:String(detail.fullJd||'').length}}

          if(canonicalUrl){
            try{
              const r=await fetch(canonicalUrl,{redirect:'follow'})
              const html=await r.text()
              const parsed=extractJobindexExternalDetail(html,{url:r.url||canonicalUrl})
              result.canonical={status:r.status,finalUrl:r.url,length:html.length,parsedLength:String(parsed.fullJd||'').length,hasJobPosting:/application\/ld\+json/i.test(html)}
            }catch(error){result.canonical={error:String(error?.message||error)}}
          }

          if(applicationUrl){
            try{
              const r=await fetch(applicationUrl,{redirect:'follow'})
              const html=await r.text()
              const parsed=extractJobindexExternalDetail(html,{url:r.url||applicationUrl})
              const recovered=recoverExternalFullJd(html,r.url||applicationUrl)
              const scripts=[...html.matchAll(/<script\b[^>]*src=["']([^"']+)["']/gi)].map(m=>m[1]).slice(0,20)
              const hrefs=[...html.matchAll(/<a\b[^>]*href=["']([^"']+)["']/gi)].map(m=>m[1]).filter(v=>/job|career|teamtailor|apply/i.test(v)).slice(0,30)
              const needles=['Senior HR Business Partner','Struers','Teamtailor','job-description','job_description','data-job','application/ld+json','__NEXT_DATA__']
              const snippets={}
              const lower=html.toLowerCase()
              for(const needle of needles){const i=lower.indexOf(needle.toLowerCase());if(i>=0) snippets[needle]=clean(html.slice(Math.max(0,i-1000),i+4500))}
              result.application={status:r.status,finalUrl:r.url,contentType:r.headers.get('content-type'),length:html.length,parsedLength:String(parsed.fullJd||'').length,recoveredLength:String(recovered||'').length,hasJsonLd:/application\/ld\+json/i.test(html),hasNextData:/__NEXT_DATA__/i.test(html),scripts,hrefs,snippets}
            }catch(error){result.application={error:String(error?.message||error)}}
          }

          console.log(JSON.stringify(result,null,2))
          NODE
