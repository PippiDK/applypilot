name: Jobindex LIMITED_DATA diagnostic

on:
  push:
    branches:
      - diag/jobindex-limited-data

jobs:
  inspect-final-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect final retrieval paths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {extractJobindexExternalDetail} from './app/lib/jobindex-parser.js'
          import {jobindexCanonicalFullJd} from './app/lib/jobindex-retrieval-fallbacks.js'
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim()
          async function inspect(label,url){
            try{
              const r=await fetch(url,{redirect:'follow'})
              const html=await r.text()
              const ext=extractJobindexExternalDetail(html,{url:r.url||url})
              const canonical=jobindexCanonicalFullJd(html)
              const classes=[...new Set([...html.matchAll(/class=["']([^"']*(?:job|description|detail|content|annonce|advert)[^"']*)["']/gi)].map(m=>m[1]).slice(0,80))]
              const needles=['Studentermedhjælper','Selvdreven projektleder','Dine primære','Project Execution','jobtext-jobad__body','job-detail-description']
              const snippets={}
              for(const needle of needles){const i=html.toLowerCase().indexOf(needle.toLowerCase());if(i>=0)snippets[needle]=clean(html.slice(Math.max(0,i-1200),i+5000))}
              console.log(label+' '+JSON.stringify({status:r.status,finalUrl:r.url,length:html.length,externalLength:String(ext?.fullJd||'').length,canonicalLength:canonical.length,classes,snippets},null,2))
            }catch(error){console.log(label+' '+JSON.stringify({error:String(error?.message||error)},null,2))}
          }
          await inspect('ENNOVA_IFRAME','https://mkjobennova.azurewebsites.net/en-us/details.aspx?VID=20260818')
          await inspect('KALUNDBORG_CANONICAL','https://www.jobindex.dk/jobannonce/h1693594/selvdreven-projektleder-til-project-execution')
          NODE
