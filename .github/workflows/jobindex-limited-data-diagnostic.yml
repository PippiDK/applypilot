name: Jobindex LIMITED_DATA diagnostic

on:
  push:
    branches:
      - diag/jobindex-limited-data

jobs:
  avature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Avature recovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {recoverExternalFullJd} from './app/lib/jobindex-live-retrieval.js'
          import {extractJobindexExternalDetail} from './app/lib/jobindex-parser.js'
          const url='https://koch.avature.net/en_US/careers/JobDetail/Regulatory-Affairs-Specialist/193263'
          const r=await fetch(url,{redirect:'follow'})
          const html=await r.text()
          const recovered=recoverExternalFullJd(html,r.url||url)
          const legacy=extractJobindexExternalDetail(html,{url:r.url||url})
          const articleOpen=[...html.matchAll(/<article\b[^>]*>/gi)].filter(m=>/article--details/i.test(m[0])).map(m=>m[0]).slice(0,5)
          const detailClass=[...html.matchAll(/class=["']([^"']*article--details[^"']*)["']/gi)].map(m=>m[1]).slice(0,10)
          const needle='Maintain a deep understanding'
          const i=html.toLowerCase().indexOf(needle.toLowerCase())
          console.log(JSON.stringify({status:r.status,finalUrl:r.url,length:html.length,recoveredLength:recovered.length,legacyLength:String(legacy.fullJd||'').length,articleOpen,detailClass,snippet:i>=0?html.slice(Math.max(0,i-1200),i+4500):''},null,2))
          NODE
