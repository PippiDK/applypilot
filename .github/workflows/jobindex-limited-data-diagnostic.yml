name: Jobindex LIMITED_DATA diagnostic

on:
  push:
    branches:
      - diag/jobindex-limited-data

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted Jobindex tests
        run: node --test app/lib/jobindex-live-retrieval.test.mjs app/lib/jobindex-parser.test.mjs app/lib/jobindex-application-url.test.mjs app/lib/jobindex-common-ats.test.mjs app/lib/jobindex-retrieval-fallbacks.test.mjs app/lib/jobindex-final-resolvers.test.mjs app/lib/jobindex-source-adapter.test.mjs app/lib/search-source-orchestrator.test.mjs

  brinch-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Brinch Partners vacancy end to end
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {searchJobindexSource} from './app/lib/jobindex-source-adapter.js'
          const title='Senior HR Business Partner'
          const source=await searchJobindexSource({freshnessDays:1,unionSearchPlan:{directions:[{key:'senior-hr-business-partner',role:title,query:title,tier:'primary'}]},exclusionRules:[],filters:{},maxPages:3})
          const target=source.jobs.find(job=>job.sourceJobId==='h1680601'||(/Senior HR Business Partner/i.test(job.title||'')&&/Brinch|Struers/i.test(job.company||'')))
          if(!target) throw new Error('Live Brinch Partners vacancy h1680601 was not retrieved')
          const limited=(target.sourceRecords||[]).some(record=>record?.limitedData===true)
          console.log(JSON.stringify({jobId:target.sourceJobId,title:target.title,company:target.company,applicationUrl:target.applicationUrl,fullJdLength:String(target.fullJd||'').length,limitedData:limited},null,2))
          if(limited||String(target.fullJd||'').length<500||!/Your responsibilities/i.test(target.fullJd||'')) throw new Error('Brinch Partners full JD recovery failed')
          NODE

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise real Jobindex relevance and full-JD flow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {runMultiSourceSearch} from './app/lib/search-source-orchestrator.js'
          import {searchJobindexSource} from './app/lib/jobindex-source-adapter.js'
          const directions=[
            {key:'project-manager',role:'Senior Project Manager',query:'Project Manager',tier:'primary',origin:'manual',cvSlots:[1]},
            {key:'delivery-manager',role:'IT Delivery Manager',query:'Delivery Manager',tier:'primary',origin:'manual',cvSlots:[1]},
          ]
          const input={freshnessDays:14,unionSearchPlan:{version:'jobindex-fix-smoke',directions},exclusionRules:[],enabledSources:['jobindex'],filters:{}}
          const source=await searchJobindexSource({...input,maxPages:1})
          const result=await runMultiSourceSearch(input,{jobindex:async()=>source})
          console.log(JSON.stringify({sourceStatus:source.status,sourceStats:source.stats,returned:result.jobs.map(item=>({title:item.job.title,score:item.evaluation?.score,limitedData:item.limitedData}))},null,2))
          if(Number(source.stats?.fullJdVerified)!==Number(source.stats?.discovered)) throw new Error(`Full JD coverage incomplete: ${source.stats?.fullJdVerified}/${source.stats?.discovered}`)
          if(Number(source.stats?.limitedData)!==0) throw new Error(`Limited-data vacancies remain: ${source.stats?.limitedData}`)
          if(result.jobs.some(item=>item.limitedData||!item.evaluation)) throw new Error('Unverified vacancy leaked into live matches')
          NODE

  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
