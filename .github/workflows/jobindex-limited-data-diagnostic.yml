name: Jobindex LIMITED_DATA diagnostic

on:
  push:
    branches:
      - diag/jobindex-limited-data

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run LIMITED_DATA regression tests
        run: node --test app/lib/jobindex-parser.test.mjs app/lib/jobindex-retrieval-fallbacks.test.mjs
