name: One-shot TEST CV storage patch

on:
  push:
    branches:
      - 'test/freshness-today-yesterday-5-10'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST branch
        uses: actions/checkout@v4
        with:
          ref: test/freshness-today-yesterday-5-10
          fetch-depth: 0
      - name: Apply minimal Main Search persistence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/main-search-base.js')
          source=path.read_text()
          replacements=[
            (
              "import {CV_LIBRARY_STORAGE_KEY,MAX_CVS,createCvLibrary,normalizeCvLibrary,upsertCvSlot,removeCvSlot,getPrimaryCv,readyCvCount} from './lib/cv-library.js'",
              "import {CV_LIBRARY_STORAGE_KEY,MAX_CVS,createCvLibrary,normalizeCvLibrary,persistCvLibrary,upsertCvSlot,removeCvSlot,getPrimaryCv,readyCvCount} from './lib/cv-library.js'"
            ),
            (
              """      setCvLibrary(library)\n      if(readyCvCount(library)>0) localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(library))\n      if(primaryCv){\n        setCvData(primaryCv)\n        localStorage.setItem(SOURCE_CV_STORAGE_KEY,JSON.stringify(primaryCv))\n        localStorage.removeItem(LEGACY_CV_STORAGE_KEY)\n      }""",
              """      setCvLibrary(library)\n      if(readyCvCount(library)>0) persistCvLibrary(localStorage,library)\n      if(primaryCv){\n        setCvData(primaryCv)\n      }"""
            ),
            (
              "      localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(nextLibrary))",
              "      persistCvLibrary(localStorage,nextLibrary)"
            ),
            (
              """        localStorage.setItem(SOURCE_CV_STORAGE_KEY,JSON.stringify(primaryCv))\n        localStorage.removeItem(LEGACY_CV_STORAGE_KEY)\n        setCvData(primaryCv)""",
              """        setCvData(primaryCv)"""
            ),
            (
              "    localStorage.setItem(CV_LIBRARY_STORAGE_KEY,JSON.stringify(nextLibrary))",
              "    persistCvLibrary(localStorage,nextLibrary)"
            ),
          ]
          for old,new in replacements:
            count=source.count(old)
            if count!=1:
              raise SystemExit(f'Expected exactly one replacement target, found {count}: {old[:90]!r}')
            source=source.replace(old,new,1)
          path.write_text(source)
          PY
      - name: Remove one-shot patch files
        run: |
          rm -f .github/workflows/test-cv-storage-patch.yml .cv-storage-patch-trigger
      - name: Commit TEST fix
        run: |
          git config user.name "PippiDK"
          git config user.email "133820767+PippiDK@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist only one current CV per library slot"
          git push origin HEAD:test/freshness-today-yesterday-5-10
