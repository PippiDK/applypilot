name: Multi-source feature verification

on:
  push:
    branches:
      - feature/jobindex-multisource-search

permissions:
  contents: read
  statuses: write

jobs:
  baseline-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Diagnose main baseline test files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          while IFS= read -r file; do
            output="$(mktemp)"
            node --test "$file" >"$output" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              context="baseline/$(basename "$file")"
              description="$(grep -m1 '^not ok' "$output" | sed -E 's/^not ok [0-9]+ - //' | cut -c1-130)"
              if [ -z "$description" ]; then
                description="Test file fails on main baseline"
              fi
              payload="$(jq -nc --arg state failure --arg context "$context" --arg description "$description" '{state:$state,context:$context,description:$description}')"
              curl -fsSL -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -d "$payload" >/dev/null
            fi
            rm -f "$output"
          done < <(find app/lib app/api -type f -name '*.test.mjs' | sort)
          exit 0
