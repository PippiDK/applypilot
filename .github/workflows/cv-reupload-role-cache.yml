name: CV Reupload Role Cache

on:
  push:
    branches:
      - fix/cv-reupload-role-cache

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
