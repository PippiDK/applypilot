name: V18 Task 2E page patcher

on:
  push:
    branches:
      - 'v18/night-flight-task2-profile-sync'

permissions:
  contents: write

jobs:
  patch-page:
    if: "!contains(github.event.head_commit.message, 'wire Task 2E sync failure warning')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v18/night-flight-task2-profile-sync
      - name: Apply exact Task 2E page wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.js')
          s=p.read_text()

          old_import="import {requestNightFlightProfileSync} from './lib/night-flight-profile-client.js'\n"
          new_import=old_import+"import {attemptNightFlightProfileSync} from './lib/night-flight-profile-failure.js'\n"
          if "attemptNightFlightProfileSync" not in s:
              if old_import not in s: raise SystemExit('Task 2E import anchor not found')
              s=s.replace(old_import,new_import,1)

          old_state="  const [profileSaveState,setProfileSaveState]=useState({loading:false,error:''})\n"
          new_state=old_state+"  const [nightFlightSyncWarning,setNightFlightSyncWarning]=useState('')\n"
          if "nightFlightSyncWarning" not in s:
              if old_state not in s: raise SystemExit('Task 2E state anchor not found')
              s=s.replace(old_state,new_state,1)

          old_sync="      await requestNightFlightProfileSync({searchProfile:saved,cv:cvData?{text:cvData.cvText,sourceVersion:cvData.sourceVersion}:null})\n"
          new_sync="      const syncResult=await attemptNightFlightProfileSync({sync:requestNightFlightProfileSync,searchProfile:saved,cv:cvData?{text:cvData.cvText,sourceVersion:cvData.sourceVersion}:null})\n      setNightFlightSyncWarning(syncResult.stale?syncResult.error:'')\n"
          if "const syncResult=await attemptNightFlightProfileSync(" not in s:
              if old_sync not in s: raise SystemExit('Task 2E sync anchor not found')
              s=s.replace(old_sync,new_sync,1)

          old_strip='    <div className="profileStrip"><span className="profileSearchSummary">{profileSearchPlanSummary}</span><button className="profileEditButton" onClick={startProfile}>{profileReady?\'Edit profile\':\'Search profile\'}</button><button className="cvButton" onClick={startProfile}>{cvReadyCount?`✓ CVs ${cvReadyCount}/${MAX_CVS}`:\'Upload CVs\'}</button></div>\n'
          warning='    {nightFlightSyncWarning&&<div className="warningBox"><b>Night Flight backend is not synced</b><span>{nightFlightSyncWarning}</span></div>}\n'
          if 'Night Flight backend is not synced' not in s:
              if old_strip not in s: raise SystemExit('Task 2E warning anchor not found')
              s=s.replace(old_strip,old_strip+'\n'+warning,1)

          p.write_text(s)
          PY
      - name: Commit exact Task 2E page wiring
        run: |
          if git diff --quiet -- app/page.js; then exit 0; fi
          git config user.name "PippiDK"
          git config user.email "133820767+PippiDK@users.noreply.github.com"
          git add app/page.js
          git commit -m "feat: wire Task 2E sync failure warning"
          git push origin HEAD:v18/night-flight-task2-profile-sync
